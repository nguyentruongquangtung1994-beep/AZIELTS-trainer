<!doctype html><html lang="vi"><head><!--AZOG:start--><meta name="description" content="Nghe chép chính tả và chọn từ theo đề Cambridge IELTS 19–21, có transcript và giải nghĩa. Thuộc AZIELTS Academy của AZEnglish."><meta property="og:type" content="website"><meta property="og:site_name" content="AZIELTS Academy"><meta property="og:title" content="AZIELTS Listening Lab"><meta property="og:description" content="Nghe chép chính tả và chọn từ theo đề Cambridge IELTS 19–21, có transcript và giải nghĩa. Thuộc AZIELTS Academy của AZEnglish."><meta property="og:url" content="https://nguyentruongquangtung1994-beep.github.io/AZIELTS-trainer/listening-gapfill-c21.html"><meta property="og:image" content="https://nguyentruongquangtung1994-beep.github.io/AZIELTS-trainer/og-azielts.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://nguyentruongquangtung1994-beep.github.io/AZIELTS-trainer/og-azielts.jpg"><!--AZOG:end--><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><title>Cambridge Listening Lab</title><meta http-equiv="refresh" content="0; url=listening-gapfill.html#c21"><!--AZP:start--><style id="azp">/* ===== AZIELTS PREMIUM — Listening Lab (Cambridge 19–21) ===== */
:root,:root[data-theme="dark"],:root[data-theme="light"]{
  --red:#D7192D; --red-soft:#FDEDEF; --ink:#111827; --paper:#FFFFFF; --ground:#FDFCF9;
  --muted:#4B5563; --line:#E8E4DA; --ok:#1F7A4D; --ok-soft:#E8F3EC; --bad:#B01322; --bad-soft:#FDEDEF;
  --chip:#FFFFFF; --shadow:0 1px 3px rgba(16,24,40,.06),0 12px 28px -16px rgba(16,24,40,.18);
  --display:"Playfair Display",Georgia,serif; --body:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:"Be Vietnam Pro",system-ui,sans-serif;
  --navy:#0B1424; --gold:#B8913A; --gold-2:#E3C27A; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:light; --red:#D7192D; --red-soft:#FDEDEF; --ink:#111827; --paper:#FFFFFF; --ground:#FDFCF9;
  --muted:#4B5563; --line:#E8E4DA; --ok:#1F7A4D; --ok-soft:#E8F3EC; --bad:#B01322; --bad-soft:#FDEDEF; --chip:#FFFFFF;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 12px 28px -16px rgba(16,24,40,.18)}}
body{background:#FDFCF9!important;color:#111827!important;-webkit-font-smoothing:antialiased}
/* đầu trang xanh đêm */
header.top{position:relative;margin-top:16px;padding:30px 28px 26px!important;border-radius:20px;background:radial-gradient(600px 360px at 92% 0%,rgba(215,25,45,.3),transparent 60%),linear-gradient(160deg,#0B1424,#13233B 55%,#0E1A2E);color:#fff;overflow:hidden}
header.top::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 40% 40%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 40% 40%,#000 30%,transparent 75%);pointer-events:none}
header.top>*{position:relative}
header.top .brand{color:var(--gold-2)!important;font-family:"Be Vietnam Pro",sans-serif!important;letter-spacing:.16em}
header.top h1{color:#fff!important;font-family:"Playfair Display",Georgia,serif!important;font-weight:700!important}
header.top .sub,header.top .sub *{color:#BAC5D6!important}
header.top .crumb a{color:var(--gold-2)!important}
h1,h2,.panel-head h2,.book h2,.dgroup h3,.card .tn{font-family:"Playfair Display",Georgia,serif!important;font-weight:700!important;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.brand,.kicker,.panel-head .kicker{color:var(--gold)!important}
/* tab Part */
nav.tabs{background:rgba(253,252,249,.95)!important;backdrop-filter:blur(10px)}
.tab{border-radius:99px!important;font-family:"Be Vietnam Pro",sans-serif!important;font-weight:600!important;border:1px solid var(--line)!important;background:#fff!important}
.tab[aria-selected="true"]{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
.tab[aria-selected="true"] .cnt{color:var(--gold-2)!important}
/* trình phát */
.player{background:linear-gradient(150deg,#0B1424,#18294A)!important;border:0!important;border-radius:16px!important;color:#fff;padding:14px 16px!important}
.speed button{border-radius:99px!important;font-family:"Be Vietnam Pro",sans-serif!important;background:rgba(255,255,255,.08)!important;color:#E6EBF3!important;border:1px solid rgba(255,255,255,.18)!important}
.speed button.on{background:linear-gradient(90deg,var(--gold),var(--gold-2))!important;color:#1A1406!important;border:0!important}
.how,.note{border-left:3px solid var(--gold)!important;background:#fff!important;border-radius:12px;padding:10px 14px!important}
/* bài nghe & ô điền */
.transcript{background:#fff!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:var(--shadow)}
.gap .num,.wgap .num,.drow .dn{background:var(--navy)!important;color:#fff!important;font-family:"Be Vietnam Pro",sans-serif!important}
.opt{border-radius:10px!important;font-family:"Be Vietnam Pro",sans-serif!important}
.opt.sel{border-color:var(--navy)!important;background:#EEF1F6!important}
.opt.sel .l{background:var(--navy)!important;color:#fff!important}
.wgap input:focus{border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(184,145,58,.2)!important}
.btn{border-radius:10px!important;font-family:"Be Vietnam Pro",sans-serif!important;font-weight:700!important}
.btn.primary{background:var(--red)!important;border-color:var(--red)!important;box-shadow:0 8px 20px -12px rgba(176,19,34,.55)!important}
.score{font-family:"Playfair Display",Georgia,serif!important;color:var(--navy)!important}
.progress i,.bar i{background:linear-gradient(90deg,var(--gold),var(--gold-2))!important}
/* trang chọn đề */
.card,.bk{background:#fff!important;border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:var(--shadow)!important}
.card:hover,.bk:hover{border-color:var(--gold)!important}
.chip{border-radius:99px!important;font-family:"Be Vietnam Pro",sans-serif!important}
.nextnav a{border-radius:10px!important}
/* thanh về Academy */
.azp-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.azp-home{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#E6EBF3;font:600 12.5px/1.2 "Be Vietnam Pro",sans-serif;text-decoration:none;white-space:nowrap}
.azp-home:hover{border-color:var(--gold-2);color:#fff}
.azp-tier{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font:700 11.5px/1.2 "Be Vietnam Pro",sans-serif;letter-spacing:.04em;white-space:nowrap}
.azp-tier.elite{background:linear-gradient(90deg,#B8913A,#E3C27A);color:#1A1406}
.azp-tier.standard{background:#E8F3EC;color:#1F7A4D}
.azp-tier.trial{background:#EAF0FD;color:#1D4ED8}
@media (max-width:600px){ header.top{padding:22px 18px 20px!important;border-radius:16px} }
/* ===== Sửa sau rà soát font & hình ảnh (21/10) ===== */
/* O: nhãn người nói và liên kết điều hướng dùng chữ giao diện */
.spk{font-family:"Be Vietnam Pro",system-ui,sans-serif!important;font-weight:700!important;letter-spacing:.1em;font-size:11.5px!important}
.crumb a,.nextnav a,header.top a{font-family:"Be Vietnam Pro",system-ui,sans-serif!important}
button,input,select,textarea{font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif!important}
.wgap input,textarea{font-family:"Source Serif 4",Georgia,serif!important}

/* ===== AZIELTS SYNC — một thang chung cho Academy · Writing Studio · Reading & Listening · Listening Lab =====
   Bo góc: 10px nút & ô nhập · 12px khối nhỏ bên trong thẻ · 16px thẻ & bảng · 20px khung lớn · 999px viên thuốc (chip, nhãn gói).
   Nút: chữ thường, đậm 700, không giãn chữ. Biểu tượng: nét mảnh 1.8. */
:root{--r-btn:10px;--r-in:12px;--r-card:16px;--r-xl:20px}
/* nút & ô nhập */
html body :is(.btn,.ghost,.nb-btn,.opt,#chk,#rst,.ws-steps button,#tabs button,select,textarea,input:not([type=checkbox]):not([type=radio]):not([type=range])):not(.mchip):not(.avatar):not(.tab):not(.azp-home){border-radius:var(--r-btn)!important}
html body :is(.btn,.ghost,.nb-btn,#chk,#rst):not(.tab){font-weight:700!important;letter-spacing:0!important;text-transform:none!important}
html body .ws-steps button{font-weight:700!important}
/* khối nhỏ bên trong thẻ */
html body :is(.nb-book,.ph,.how,.board-note,.essay-raw,details.faq-i,.faq details,.ico,.ti){border-radius:var(--r-in)!important}
/* thẻ & bảng */
html body :is(.panel,.wk-it,.figure,nav#tabs,.ws-steps,.jmap,.rc,.pgrid,.tch,.plan,.perk,.stats,.float,.acct,.auth,.place,.step,.nb-skill,.nb-writing,.nb-strategy,.nb-stats,.nb-panel,.bk,.card,.steps,.player,.transcript,.app){border-radius:var(--r-card)!important}
/* khung lớn */
html body :is(aside.side,.frame,.nb-hero,.az-hero,header.top,.hello,.hero-card){border-radius:var(--r-xl)!important}
/* biểu tượng nét mảnh */
html body :is(.azi,.nb-skill .ico svg,.nb-strategy .i svg,.azp-ico){stroke-width:1.8!important}
html body .nb-strategy .i svg,html body .azp-ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
html body .azp-ico{width:18px;height:18px;vertical-align:-3px;margin-right:8px;color:var(--gold,#B8913A)}
html body .nb-strategy .i svg{margin:0!important;color:inherit!important}
html body a.card > .tn{display:flex;align-items:center}
</style><script>window.AZP_ACAD="academy.html";window.AZP_HOST="header.top";/* AZIELTS PREMIUM — dùng chung cho trang học tĩnh: nạp font, luôn sáng, nút về Academy + huy hiệu gói */
(function () {
  try {
    var l = document.createElement("link"); l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600&display=swap";
    document.head.appendChild(l);
  } catch (e) {}
  var root = document.documentElement;
  function light() { if (root.getAttribute("data-theme") === "dark") root.setAttribute("data-theme", "light"); }
  light(); try { new MutationObserver(light).observe(root, { attributes: true, attributeFilter: ["data-theme"] }); } catch (e) {}
  /* EMOJI: bỏ biểu tượng emoji còn sót trong nội dung cũ (đồng hồ ⏱, tiêu đề 📋 🎯 📌…) để giao diện premium */
  try {
    var EM = /(?:[\u{1F000}-\u{1FAFF}]|[⏩-⏺]|[☀-⛿]|⭐)️?\s?/gu;
    var strip = function (root) { var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n; while ((n = w.nextNode())) { if (n.parentElement && /^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentElement.tagName)) continue; if (EM.test(n.textContent)) { EM.lastIndex = 0; n.textContent = n.textContent.replace(EM, ""); } EM.lastIndex = 0; } };
    var go = function () { strip(document.body); new MutationObserver(function (ms) { ms.forEach(function (m) { m.addedNodes.forEach(function (x) { if (x.nodeType === 1) strip(x); else if (x.nodeType === 3 && x.parentNode) strip(x.parentNode); }); }); }).observe(document.body, { childList: true, subtree: true }); };
    if (document.body) go(); else document.addEventListener("DOMContentLoaded", go);
  } catch (e) {}
  /* BIỂU TƯỢNG: bộ nét mảnh chung với Academy & Writing Studio (thay ô "!" thẻ Chiến lược, thêm tai nghe / mẹo cho Listening Lab) */
  try {
    var SVG = function (d) { return '<svg class="azp-ico" viewBox="0 0 24 24" aria-hidden="true">' + d + "</svg>"; };
    var ICO = { compass: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
      phones: '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
      tip: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>' };
    var deco = function () {
      document.querySelectorAll(".nb-strategy .i").forEach(function (e) { if (e.textContent.trim() === "!") e.innerHTML = SVG(ICO.compass).replace("azp-ico", "azp-ico azp-big"); });
      document.querySelectorAll("a.card > .tn").forEach(function (e) { if (!e.querySelector(".azp-ico")) e.insertAdjacentHTML("afterbegin", SVG(ICO.phones)); });
      document.querySelectorAll(".steps > b:first-child").forEach(function (e) { if (!e.querySelector(".azp-ico")) e.insertAdjacentHTML("afterbegin", SVG(ICO.tip)); });
    };
    var goDeco = function () { deco(); new MutationObserver(function () { deco(); }).observe(document.body, { childList: true, subtree: true }); };
    if (document.body) goDeco(); else document.addEventListener("DOMContentLoaded", goDeco);
  } catch (e) {}
  var s = null; try { s = JSON.parse(localStorage.getItem("az_acad") || "null"); } catch (e) {}
  if (!s || !s.u) return;
  var TIER = { elite: "Elite", standard: "Standard", trial: "Dùng thử" };
  var ACAD = (window.AZP_ACAD || "academy.html");
  function mount() {
    if (document.querySelector(".azp-bar")) return;
    var host = document.querySelector(window.AZP_HOST || ".masthead"); if (!host) return;
    var bar = document.createElement("div"); bar.className = "azp-bar";
    bar.innerHTML = '<a class="azp-home" href="' + ACAD + '" title="Về AZIELTS Academy">← Academy</a>' + (TIER[s.tier] ? '<span class="azp-tier ' + s.tier + '">' + TIER[s.tier] + "</span>" : "");
    host.appendChild(bar);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", mount); else mount();
  setTimeout(mount, 600); setTimeout(mount, 2000);
})();
</script><!--AZP:end--></head><body><a href="listening-gapfill.html#c21">Mở Cambridge Listening Lab</a></body></html>
