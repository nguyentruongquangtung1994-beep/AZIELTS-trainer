<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hồ sơ tư vấn IELTS</title>
<meta name="color-scheme" content="light"><meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap">
<style>
:root{color-scheme:light;--ink:#111827;--ink2:#4B5563;--ink3:#8A93A3;--line:#E8E4DA;--red:#D7192D;--deep:#B01322;--gold:#B8913A;--gold2:#E3C27A;--navy:#0B1424}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(800px 500px at 85% 0%,rgba(215,25,45,.3),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(58,96,170,.25),transparent 60%),linear-gradient(160deg,#0B1424,#13233B 55%,#0E1A2E)}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 75%);pointer-events:none}
form{position:relative;width:100%;max-width:420px;background:#FDFCF9;border-radius:20px;padding:34px 32px 26px;box-shadow:0 40px 80px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
form::before{content:"";position:absolute;left:32px;right:32px;top:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2),transparent)}
.mk{width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#C8162B,#8E0D1D);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.k{display:flex;align-items:center;gap:10px;margin-top:20px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.k::before{content:"";width:24px;height:1px;background:var(--gold)}
h1{font-family:"Playfair Display",Georgia,serif;font-size:30px;line-height:1.15;margin:8px 0 10px;font-weight:700}p{margin:0 0 20px;color:var(--ink2);font-size:14.5px;line-height:1.6}
input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border-radius:10px;border:1px solid #D8D2C4;background:#fff;color:var(--ink);margin:0 0 12px}
input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px rgba(215,25,45,.12)}
button{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;font:700 15.5px "Be Vietnam Pro",system-ui,sans-serif;border:0;border-radius:10px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 10px 24px -10px rgba(176,19,34,.6)}
button:hover{background:var(--deep)}button[disabled]{opacity:.7;cursor:wait}
button:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
#err{color:var(--deep);font-size:13px;font-weight:600;min-height:18px;margin:10px 0 0}
.ft{margin:14px 0 0;font-size:12.5px;color:var(--ink3);text-align:center}
</style></head><body>
