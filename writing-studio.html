<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AZIELTS Writing Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#F4F5F7;--card:#fff;--ink:#0F1013;--ink2:#4B4F57;--line:#E1E4E8;--red:#E0102B}
@media (prefers-color-scheme:dark){:root{--bg:#0C0D10;--card:#15171B;--ink:#F2F3F5;--ink2:#B8BCC4;--line:#2A2D34;--red:#FF4560;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;padding:20px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.mk{width:46px;height:46px;border-radius:11px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:24px;letter-spacing:-.025em;margin:16px 0 6px;font-weight:800}p{margin:0 0 18px;color:var(--ink2);font-size:14px;line-height:1.55}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:10px}
input:focus{outline:2px solid var(--red);border-color:transparent}
button{width:100%;font:inherit;font-weight:700;font-size:15px;padding:12px;border:0;border-radius:11px;background:var(--red);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}#err{color:var(--red);font-size:13px;min-height:18px;margin:10px 0 0}
</style></head><body>
