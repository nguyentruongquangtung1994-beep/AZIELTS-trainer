ận thức","Schools should raise awareness about recycling.","advanced"],["pristine","còn nguyên sơ","We found a pristine beach with no tourists.","advanced"],["man's best friend","bạn thân của con người (chó)","Dogs are called man's best friend for a reason.","advanced"],["a fragrant scent","hương thơm ngào ngạt","Jasmine has a fragrant scent at night.","advanced"],["mother nature","mẹ thiên nhiên","We should respect mother nature.","advanced"],["take for granted","coi là điều hiển nhiên","We take clean water for granted.","advanced"]],"models":[{"part":1,"q":"Do you like animals?","cue":null,"a":"Yes, I do, especially dogs. We adopted a [[stray dog]] three years ago, and he's become a really [[loyal companion]]. Cats, on the other hand, I'm not so sure about — they seem a bit too independent for me.","n":"Ý chính + câu chuyện cá nhân + một ý đối lập (\"on the other hand\") — giữ Part 1 sinh động. Đảo tân ngữ \"Cats… I'm not so sure about\" là cấu trúc nói tự nhiên.","vocab":[["stray dog","chó hoang"],["loyal companion","người bạn trung thành"]]},{"part":1,"q":"Do you often look at the sky?","cue":null,"a":"Not as often as I'd like. In the city, light pollution means you can rarely see stars. But when I visit my grandparents in the countryside, I love lying outside and looking at the [[starry sky]].","n":"Trả lời trung thực (không thường xuyên) + lý do + ngoại lệ. Cụm \"light pollution\" là từ vựng môi trường hay.","vocab":[["starry sky","bầu trời đầy sao"]]},{"part":1,"q":"What do you do to protect the environment?","cue":null,"a":"Only small things, but I try. I carry a reusable bottle to avoid [[single-use plastic]], and my family [[recycles]] paper and cans. I know it won't save the planet on its own, but if everyone did the same, it would make a difference.","n":"Liệt kê việc làm cụ thể + câu điều kiện loại 2 ở cuối để mở rộng ý — một cách Redirection rút gọn cho Part 1.","vocab":[["single-use plastic","nhựa dùng một lần"],["recycles","tái chế"]]},{"part":2,"q":"Describe a law on environmental protection your country should have","cue":["what the law is","how it would work","who it would affect","and explain why your country should have it"],"a":"The law I'd like to see in Vietnam is a nationwide ban on [[single-use plastic]] bags and straws in shops and restaurants.<br>The way it would work is fairly simple. Shops would no longer be allowed to give out free plastic bags, and anyone who wanted one would have to buy a reusable bag instead. Restaurants and cafes would have to switch to paper or metal straws. The government could [[impose a fine]] on businesses that broke the rule, and it should be [[strictly enforced]], especially in big cities.<br>It would mainly affect retailers and street vendors, who would need time and maybe some financial support to change. Of course, ordinary shoppers would be affected too, because we'd all need to remember to bring our own bags.<br>I think we really need this law because plastic waste is everywhere: in our rivers, on our beaches and even in the fish we eat. Some countries, like Rwanda, have already shown that a total ban can work. I know some people would see it as [[a heavy-handed approach]], but voluntary campaigns haven't been enough. A clear law would also [[raise awareness]] among children, and that could change habits for a whole generation.","n":"Đề giả định → dùng \"would\" xuyên suốt (would work, would have to, would affect). Có ví dụ quốc gia thật (Rwanda) và tự phản biện (\"some people would see it as…\") rồi bác lại — dấu hiệu tư duy band 7+.","vocab":[["single-use plastic","nhựa dùng một lần"],["impose a fine","phạt tiền"],["strictly enforced","được thực thi nghiêm"],["a heavy-handed approach","cách làm quá cứng rắn"],["raise awareness","nâng cao nhận thức"]]},{"part":3,"q":"Who should be responsible for protecting the environment, governments or individuals?","cue":null,"a":"I'd say both, but governments carry more responsibility because they have the power to change systems. An individual can recycle, but only a government can build recycling plants or tax polluting companies. In Vietnam, for instance, people were more willing to sort rubbish once local authorities provided separate bins. Still, laws only work if citizens support them, so public attitudes matter too.","n":"PEER: Point (\"both, but governments carry more…\") → Explanation (quyền thay đổi hệ thống) → Example (thùng rác phân loại) → Redirection (\"Still…\" quay lại vai trò cá nhân).","vocab":[]},{"part":3,"q":"Why is it important to protect wild animals?","cue":null,"a":"Partly for ethical reasons, and partly for practical ones. Every species plays a role in its ecosystem, so if one disappears, others are affected. Bees are the clearest example: without them, many crops would fail. On top of that, many animals are [[on the verge of extinction]] because of human activity, so I feel we have a duty to fix the damage we've caused.","n":"Mở bằng phân loại lý do (ethical / practical) — cách tổ chức ý rất \"Part 3\". Ví dụ con ong cụ thể, kết bằng trách nhiệm con người.","vocab":[["on the verge of extinction","đứng bên bờ tuyệt chủng"]]}]},{"id":"sp-shopping","en":"Shopping, objects and money","vi":"Mua sắm, đồ vật và tiền bạc","cues":["Part 1: Shoes","Part 1: Purse or wallet","Part 1: Special costumes","Part 2: Describe a time that you were shopping in a street market or an outdoor market","Part 2: Describe something special that you saved money to buy","Part 2: Describe a good service you received","Part 2: Describe a piece of equipment that is important in your home"],"words":[["go shopping","đi mua sắm","I go shopping with my mum at the weekend.","basic"],["a pair of shoes","một đôi giày","I bought a pair of shoes for running.","basic"],["save money","tiết kiệm tiền","I saved money for six months to buy a laptop.","basic"],["spend money on","tiêu tiền vào","I spend too much money on clothes.","basic"],["on sale","đang giảm giá","I bought this jacket when it was on sale.","basic"],["expensive","đắt","Branded shoes are too expensive for me.","basic"],["street market","chợ đường phố","I love shopping at the street market near my house.","basic"],["a birthday present","quà sinh nhật","My parents gave me a watch as a birthday present.","basic"],["pay by card","trả bằng thẻ","Most shops let you pay by card now.","basic"],["a shopping mall","trung tâm thương mại","There's a big shopping mall near my office.","basic"],["try on","thử (đồ)","I always try on clothes before buying them.","basic"],["good quality","chất lượng tốt","These shoes are cheap but good quality.","basic"],["friendly staff","nhân viên thân thiện","The shop had very friendly staff.","basic"],["a good bargain","món hời","I got a good bargain on these headphones.","intermediate"],["haggle over the price","mặc cả","You have to haggle over the price at the market.","intermediate"],["window shopping","ngắm đồ không mua","I enjoy window shopping more than actually buying.","intermediate"],["impulse buying","mua sắm bốc đồng","Impulse buying is my biggest weakness.","intermediate"],["value for money","đáng đồng tiền","The meal was great value for money.","intermediate"],["brand-new","mới tinh","I saved up for a brand-new bicycle.","intermediate"],["save up for","dành dụm để mua","I'm saving up for a trip to Japan.","intermediate"],["sentimental value","giá trị tinh thần","My wallet has sentimental value because it was a gift.","intermediate"],["customer service","dịch vụ khách hàng","The customer service at that hotel was excellent.","intermediate"],["go out of their way","cố gắng hết sức (để giúp)","The staff went out of their way to help me.","intermediate"],["a traditional costume","trang phục truyền thống","I wore a traditional costume, the ao dai, at my graduation.","intermediate"],["fashionable","hợp thời trang","My sister always wears fashionable clothes.","intermediate"],["worth every penny","đáng từng đồng","The course was expensive, but it was worth every penny.","intermediate"],["live on a tight budget","sống với ngân sách eo hẹp","Students often live on a tight budget.","intermediate"],["splash out on","vung tiền vào","I splashed out on a new phone after my first salary.","advanced"],["cost an arm and a leg","đắt cắt cổ","That designer bag cost an arm and a leg.","advanced"],["a rip-off","món bị chặt chém","Ten dollars for a coffee is a rip-off.","advanced"],["shop till you drop","mua sắm đến kiệt sức","We shopped till we dropped in Bangkok.","advanced"],["tighten my belt","thắt lưng buộc bụng","I had to tighten my belt to save for the trip.","advanced"],["a shopaholic","người nghiện mua sắm","My cousin is a total shopaholic.","advanced"],["go the extra mile","làm nhiều hơn mong đợi","The waiter went the extra mile to make my birthday special.","advanced"],["built to last","bền bỉ, làm để dùng lâu","My grandfather's radio was built to last.","advanced"],["can't do without","không thể thiếu","The rice cooker is something my family can't do without.","advanced"],["a vibrant atmosphere","không khí rộn ràng","The night market has a vibrant atmosphere.","advanced"],["money well spent","tiền tiêu đáng giá","The new mattress was money well spent.","advanced"],["a treasured possession","vật quý giá","That old camera is my most treasured possession.","advanced"]],"models":[{"part":1,"q":"Do you enjoy shopping?","cue":null,"a":"It depends what I'm buying. I love browsing in bookshops, but shopping for clothes stresses me out. I'm also quite prone to [[impulse buying]], so I try not to go to shopping malls when I'm bored.","n":"\"It depends\" + ví dụ đối lập + nhận xét bản thân. \"prone to\" (dễ mắc) là cụm band 7.","vocab":[["impulse buying","mua sắm bốc đồng"]]},{"part":1,"q":"Do you prefer shopping online or in shops?","cue":null,"a":"Mostly online, because it's quicker and I can compare prices easily. But for shoes I always go to a real shop, because I need to [[try them on]] — sizes are never consistent between brands.","n":"Lựa chọn chung + ngoại lệ có lý do. Chia cụm động từ tách \"try them on\" đúng ngữ pháp (tân ngữ đại từ nằm giữa).","vocab":[["try them on","thử (đồ)"]]},{"part":1,"q":"Is it common to bargain in your country?","cue":null,"a":"Yes, especially at traditional markets. Locals often [[haggle over the price]], and sellers usually expect it. In supermarkets and shopping malls, though, prices are fixed.","n":"Câu hỏi thông tin văn hoá → trả lời ngắn có so sánh hai nơi (markets vs malls).","vocab":[["haggle over the price","mặc cả"]]},{"part":2,"q":"Describe something special that you saved money to buy","cue":["what it was","how long you saved for it","why you wanted it","and explain how you felt when you bought it"],"a":"I'd like to talk about my laptop, which I bought in my second year of university after saving for almost eight months.<br>At that time I was using my brother's old computer, which was painfully slow and kept shutting down in the middle of my assignments. So I decided to [[save up for]] a decent laptop myself instead of asking my parents.<br>I put aside part of my salary from my [[part-time job]] every month, and I cut back on eating out and buying clothes. I even sold some old textbooks online. It meant I had to [[live on a tight budget]] for a while, but having a clear goal made it much easier.<br>I wanted it not just for studying but also for design work, because I was starting to do small freelance projects. A good machine was basically an investment in my future.<br>When I finally walked out of the shop with it, I felt incredibly proud. It wasn't the most expensive model, but it was [[brand-new]] and it was mine. It has lasted four years now, and I'd say it was [[worth every penny]] — and probably [[money well spent]] more than anything else I've bought.","n":"Có quá trình tiết kiệm cụ thể (put aside, cut back on, sold textbooks) — gợi ý \"how long\" thường bị nói sơ sài. Hai cụm cuối đồng nghĩa nhau nên chỉ cần dùng một khi thi; ở đây để học cả hai.","vocab":[["save up for","dành dụm để mua"],["part-time job","việc làm bán thời gian"],["live on a tight budget","sống với ngân sách eo hẹp"],["brand-new","mới tinh"],["worth every penny","đáng từng đồng"],["money well spent","tiền tiêu đáng giá"]]},{"part":3,"q":"Why do people buy things they don't need?","cue":null,"a":"A lot of it comes down to advertising and social pressure. Ads and influencers make products look essential, and people want to keep up with their friends. Flash sales are a good example: a \"50% off\" sign can make us buy something we'd never have looked at otherwise. I think we also shop to cheer ourselves up, so for some people it's more about emotions than needs.","n":"PEER: Point (quảng cáo + áp lực xã hội) → Explanation → Example (flash sale) → Redirection mở sang lý do cảm xúc. \"comes down to\" = rốt cuộc là do — cụm mở Point rất hay.","vocab":[]},{"part":3,"q":"Do you think good customer service is important?","cue":null,"a":"Definitely, and probably more important than price for many people. When staff [[go out of their way]] to help, customers remember it and come back. I once lost my receipt and the shop still exchanged my shoes, so I've bought from them ever since. On the other hand, a single rude experience can be shared online and damage a business's reputation very quickly.","n":"PEER: Point → Explanation (khách quay lại) → Example cá nhân → Redirection (mặt tiêu cực lan trên mạng). Nối sang chủ đề truyền thông — giám khảo thích câu trả lời liên kết nhiều mảng.","vocab":[["go out of their way","cố gắng hết sức (để giúp)"]]}]},{"id":"sp-culture","en":"Culture, festivals and the arts","vi":"Văn hoá, lễ hội và nghệ thuật","cues":["Part 1: Festival","Part 1: Museums","Part 2: Describe a book you have read recently","Part 2: Describe your favorite film/movie","Part 2: Describe a creative person whose work you admire","Collins Unit 10: Culture (Culture and modern society)"],"words":[["Lunar New Year","Tết Nguyên Đán","Lunar New Year is the biggest festival in Vietnam.","basic"],["visit a museum","đi bảo tàng","I visited a museum about the war in Hanoi.","basic"],["read a novel","đọc tiểu thuyết","I read a novel before going to bed.","basic"],["go to the cinema","đi xem phim rạp","I go to the cinema with my friends once a month.","basic"],["traditional food","món ăn truyền thống","Banh chung is a traditional food at Tet.","basic"],["family reunion","sum họp gia đình","Tet is a time for family reunion.","basic"],["a love story","chuyện tình yêu","The film is a sad love story.","basic"],["lucky money","tiền lì xì","Children receive lucky money at Tet.","basic"],["live music","nhạc sống","There's live music at the festival every night.","basic"],["an art gallery","phòng tranh","There's a small art gallery near my school.","basic"],["main character","nhân vật chính","The main character is a young doctor.","basic"],["celebrate","ăn mừng, kỷ niệm","We celebrate the Mid-Autumn Festival with mooncakes.","basic"],["fireworks","pháo hoa","We watched fireworks at midnight.","basic"],["a page-turner","cuốn sách lôi cuốn","The book was a real page-turner.","intermediate"],["a blockbuster","phim bom tấn","I usually watch blockbusters at the cinema.","intermediate"],["the plot","cốt truyện","The plot was full of surprises.","intermediate"],["a festive atmosphere","không khí lễ hội","The streets have a festive atmosphere before Tet.","intermediate"],["cultural heritage","di sản văn hoá","Hoi An is part of our cultural heritage.","intermediate"],["a must-see","thứ nhất định phải xem","That museum is a must-see for visitors.","intermediate"],["the special effects","hiệu ứng đặc biệt","The special effects in the film were amazing.","intermediate"],["pass down","truyền lại (qua thế hệ)","Recipes are passed down from grandmother to granddaughter.","intermediate"],["historical artefacts","hiện vật lịch sử","The museum has many historical artefacts.","intermediate"],["an interactive exhibition","triển lãm có tương tác","Kids love the interactive exhibition.","intermediate"],["well worth reading","rất đáng đọc","The novel is well worth reading.","intermediate"],["a heart-warming story","câu chuyện ấm lòng","The film is a heart-warming story about a family.","intermediate"],["customs and traditions","phong tục tập quán","Young people should learn about our customs and traditions.","intermediate"],["be moved to tears","xúc động rơi nước mắt","I was moved to tears at the ending.","intermediate"],["a cliffhanger","đoạn kết bỏ lửng gây tò mò","Each chapter ends with a cliffhanger.","advanced"],["a tear-jerker","phim/sách lấy nước mắt","That film is a real tear-jerker.","advanced"],["thought-provoking","khiến người ta suy ngẫm","It's a thought-provoking novel about freedom.","advanced"],["a feast for the eyes","bữa tiệc thị giác","The lantern festival is a feast for the eyes.","advanced"],["steeped in history","thấm đẫm lịch sử","The old town is steeped in history.","advanced"],["gripping","hấp dẫn, cuốn hút","The story was so gripping that I finished it in one night.","advanced"],["a masterpiece","kiệt tác","I think that film is a masterpiece.","advanced"],["ring in the new year","đón năm mới","We ring in the new year with fireworks.","advanced"],["bring history to life","làm lịch sử trở nên sống động","Good museums bring history to life.","advanced"],["rave reviews","những lời khen nức nở","The film received rave reviews.","advanced"],["an acquired taste","thứ phải quen mới thích","Traditional opera is an acquired taste.","advanced"],["stand the test of time","trường tồn với thời gian","Classic novels stand the test of time.","advanced"],["a household name","cái tên ai cũng biết","That singer has become a household name.","advanced"]],"models":[{"part":1,"q":"What's the most important festival in your country?","cue":null,"a":"Without a doubt, [[Lunar New Year]], or Tet. It's the time for [[family reunion]]; people travel back to their hometowns, visit relatives and give [[lucky money]] to children. The whole country slows down for about a week.","n":"Trả lời + 3 hoạt động tiêu biểu liệt kê nhanh + câu kết khái quát. Nhớ giải thích tên riêng (Tet) cho giám khảo nước ngoài.","vocab":[["Lunar New Year","Tết Nguyên Đán"],["family reunion","sum họp gia đình"],["lucky money","tiền lì xì"]]},{"part":1,"q":"Do you like visiting museums?","cue":null,"a":"I do, as long as they're interactive. Some museums are just rooms of objects behind glass, which I find a bit dull. But places with an [[interactive exhibition]] really [[bring history to life]].","n":"Trả lời có điều kiện (\"as long as\") + so sánh hai kiểu bảo tàng. \"as long as\" là liên từ điều kiện ít học viên dùng.","vocab":[["interactive exhibition","triển lãm có tương tác"],["bring history to life","làm lịch sử trở nên sống động"]]},{"part":1,"q":"What kind of films do you like?","cue":null,"a":"Mostly thrillers and science fiction. I like films with a clever [[plot]] that keeps me guessing. I'm not really into romantic comedies, because I can usually predict the ending after ten minutes.","n":"Thể loại + lý do + loại không thích kèm lý do. Lý do hài hước nhẹ giúp nói tự nhiên.","vocab":[["plot","cốt truyện"]]},{"part":2,"q":"Describe a book you have read recently","cue":["what the book is","what it is about","why you chose it","and explain how you felt about it"],"a":"The book I'd like to talk about is \"The Midnight Library\" by Matt Haig, which I finished a couple of weeks ago.<br>It's about a woman called Nora who feels her life has gone wrong. One night she finds herself in a strange library where every book lets her live a different version of her life — one where she became a swimmer, one where she married her ex, and so on.<br>I chose it because a friend kept recommending it, and the idea of seeing your other possible lives sounded fascinating. Also, it's written in fairly simple English, so it was a good way to practise reading.<br>To be honest, it was a real [[page-turner]]; the chapters are short and each one ends with a [[cliffhanger]], so I kept telling myself \"just one more\". But more than that, I found it really [[thought-provoking]]. It made me think about my own regrets and realise that the \"perfect\" life probably doesn't exist.<br>I was actually [[moved to tears]] near the end, which surprised me. I'd say it's [[well worth reading]], especially for students who are stressed about making the right choices.","n":"Tóm tắt nội dung ngắn (2 câu) — lỗi hay gặp là kể quá dài phần cốt truyện, hết giờ trước khi nói cảm nhận. Phần cảm nhận dùng nhiều tính từ đánh giá sách đúng chỗ.","vocab":[["page-turner","cuốn sách lôi cuốn"],["cliffhanger","đoạn kết bỏ lửng gây tò mò"],["thought-provoking","khiến người ta suy ngẫm"],["moved to tears","xúc động rơi nước mắt"],["well worth reading","rất đáng đọc"]]},{"part":3,"q":"Why is it important to keep traditional festivals?","cue":null,"a":"Because festivals connect generations. They're one of the few times when grandparents, parents and children do the same activities together, so [[customs and traditions]] get [[passed down]] naturally. Making banh chung at Tet, for example, is how many children learn about their culture. That said, I think it's fine for festivals to change a little; traditions survive best when young people still find them meaningful.","n":"PEER: Point (gắn kết thế hệ) → Explanation → Example (gói bánh chưng) → Redirection (\"That said…\" chấp nhận đổi mới). Ví dụ văn hoá Việt Nam giúp câu trả lời độc đáo.","vocab":[["customs and traditions","phong tục tập quán"],["passed down","được truyền lại"]]},{"part":3,"q":"Do you think young people read less than in the past?","cue":null,"a":"They probably read fewer books, but I wouldn't say they read less overall. Young people read a huge amount online — messages, articles, comments. The problem is that this kind of reading is fast and shallow, whereas a novel requires long concentration. So the real challenge is encouraging deep reading, perhaps through school book clubs.","n":"Câu trả lời tinh tế: phân biệt \"fewer books\" và \"read less overall\" — cách phản biện lại tiền đề câu hỏi, rất được điểm. \"whereas\" để đối chiếu, kết bằng giải pháp.","vocab":[]}]},{"id":"sp-health","en":"Health, sport and lifestyle","vi":"Sức khoẻ, thể thao và lối sống","cues":["Part 2: Describe an article on health you read in a magazine or on the Internet","Part 2: Describe a famous athlete you know","Part 2: Describe a natural talent (sports, music, etc) you want to improve","Part 2: Describe a habit your friend has and you want to develop","Part 2: Describe a time when you got up early","Collins Unit 2: A healthy body (Health and fitness)"],"words":[["keep fit","giữ dáng, giữ sức khoẻ","I go jogging to keep fit.","basic"],["eat healthily","ăn uống lành mạnh","I try to eat healthily and avoid fast food.","basic"],["go to the gym","đi tập gym","I go to the gym three times a week.","basic"],["get enough sleep","ngủ đủ giấc","I can't concentrate if I don't get enough sleep.","basic"],["play football","chơi bóng đá","I play football with my colleagues on Fridays.","basic"],["junk food","đồ ăn vặt không lành mạnh","I eat too much junk food when I'm stressed.","basic"],["catch a cold","bị cảm lạnh","I often catch a cold when the weather changes.","basic"],["go jogging","chạy bộ","I go jogging in the park every morning.","basic"],["a healthy diet","chế độ ăn lành mạnh","A healthy diet includes lots of vegetables.","basic"],["lose weight","giảm cân","My dad wants to lose weight.","basic"],["feel tired","cảm thấy mệt","I feel tired after a long day at work.","basic"],["drink plenty of water","uống nhiều nước","I drink plenty of water in summer.","basic"],["see a doctor","đi khám bác sĩ","You should see a doctor if the pain continues.","basic"],["work out","tập luyện","I work out at home using online videos.","intermediate"],["a sedentary lifestyle","lối sống ít vận động","Office workers often have a sedentary lifestyle.","intermediate"],["stay in shape","giữ vóc dáng","Swimming helps me stay in shape.","intermediate"],["cut down on","cắt giảm","I'm trying to cut down on sugar.","intermediate"],["stressed out","căng thẳng tột độ","I get stressed out before exams.","intermediate"],["a balanced diet","chế độ ăn cân bằng","Athletes need a balanced diet.","intermediate"],["a healthy habit","thói quen lành mạnh","Getting up early is a healthy habit.","intermediate"],["mental health","sức khoẻ tinh thần","People are talking more about mental health.","intermediate"],["break a habit","bỏ một thói quen","It's hard to break a habit like staying up late.","intermediate"],["stick to","kiên trì theo","I find it hard to stick to an exercise plan.","intermediate"],["a dedicated athlete","vận động viên tận tuỵ","She is a dedicated athlete who trains every day.","intermediate"],["world-class","đẳng cấp thế giới","He is a world-class footballer.","intermediate"],["out of breath","hụt hơi","I was out of breath after climbing the stairs.","intermediate"],["be on a diet","đang ăn kiêng","My sister is on a diet before her wedding.","intermediate"],["as fit as a fiddle","khoẻ như vâm","My grandmother is eighty but as fit as a fiddle.","advanced"],["burn out","kiệt sức (vì làm việc quá sức)","I burned out after working seven days a week.","advanced"],["a night owl","cú đêm, người hay thức khuya","I'm a night owl, so mornings are hard for me.","advanced"],["in peak condition","trong thể trạng tốt nhất","He was in peak condition before the tournament.","advanced"],["a sweet tooth","người hảo ngọt","I have a sweet tooth, so I can't resist cake.","advanced"],["get a new lease of life","như được hồi sinh, tràn đầy sức sống","After quitting smoking, my uncle got a new lease of life.","advanced"],["moderation is key","điều độ là chìa khoá","With fast food, moderation is key.","advanced"],["push myself to the limit","ép bản thân tới giới hạn","I pushed myself to the limit in my first marathon.","advanced"],["a wake-up call","hồi chuông cảnh tỉnh","The health article was a wake-up call for me.","advanced"],["rise to fame","vươn lên nổi tiếng","She rose to fame after winning a gold medal.","advanced"],["sleep-deprived","thiếu ngủ","Many students are sleep-deprived during exam season.","advanced"],["evidence-based","dựa trên bằng chứng","I prefer evidence-based health advice.","advanced"],["a role model for young people","tấm gương cho giới trẻ","That athlete is a role model for young people.","advanced"]],"models":[{"part":1,"q":"Do you do any exercise?","cue":null,"a":"Yes, I try to [[go jogging]] three times a week before work. I used to go to the gym, but I found it boring, so now I prefer exercising outdoors. It helps me [[stay in shape]] and clears my head.","n":"Hiện tại + quá khứ (\"used to\") + lý do thay đổi — 3 câu đủ 3 thì.","vocab":[["go jogging","chạy bộ"],["stay in shape","giữ vóc dáng"]]},{"part":1,"q":"Do you think you have a healthy diet?","cue":null,"a":"Fairly healthy, but not perfect. I eat a lot of vegetables because my mum cooks most meals, but I [[have a sweet tooth]], so I find it hard to [[cut down on]] cakes and bubble tea.","n":"Tự đánh giá có mức độ (\"Fairly…, but not perfect\") + điểm tốt + điểm chưa tốt. \"bubble tea\" — chi tiết đời thường làm câu trả lời thật.","vocab":[["have a sweet tooth","hảo ngọt"],["cut down on","cắt giảm"]]},{"part":1,"q":"Are you a morning person or a night person?","cue":null,"a":"Definitely [[a night owl]]. My brain seems to work best after 10 p.m., which is great for studying but terrible for early classes. I'm trying to change, though, because being [[sleep-deprived]] affects my concentration.","n":"P–E–E với hai thành ngữ đúng nghĩa. \"which is great for… but terrible for…\" là mệnh đề quan hệ nối tiếp hay.","vocab":[["a night owl","cú đêm, người hay thức khuya"],["sleep-deprived","thiếu ngủ"]]},{"part":2,"q":"Describe a habit your friend has and you want to develop","cue":["who your friend is","what the habit is","how long they have had it","and explain why you want to develop it"],"a":"I'd like to talk about my friend Minh, who I've known since secondary school, and his habit of getting up at five every morning.<br>Minh has been an early riser for about three years. He started when he was preparing for his university entrance exam, because he found he could concentrate better before his family woke up, and he simply [[stuck to]] it after that.<br>What impresses me is how he uses that time. He spends the first half hour running, then he reads or studies for an hour, and he still has time for a proper breakfast. By eight o'clock, when I'm usually just waking up, he's already done more than I do all morning.<br>I want to develop this habit for a couple of reasons. First, I'm [[a night owl]], and I've noticed that staying up late makes me [[sleep-deprived]] and less productive the next day. Second, Minh is noticeably calmer and more organised than most people I know, and I'm sure his routine is part of the reason.<br>I've tried a few times, but I always [[break the habit]] after a week. So I'm going to start small — getting up fifteen minutes earlier each week. For me, it would be [[a wake-up call]] in more ways than one.","n":"Thì hiện tại hoàn thành tiếp diễn \"has been an early riser for three years\" trả lời đúng gợi ý \"how long\". Câu kết chơi chữ \"a wake-up call in more ways than one\" (vừa nghĩa đen vừa nghĩa bóng) — điểm nhấn từ vựng tự nhiên.","vocab":[["stuck to","kiên trì theo"],["a night owl","cú đêm, người hay thức khuya"],["sleep-deprived","thiếu ngủ"],["break the habit","bỏ một thói quen (ở đây: bỏ dở thói quen mới)"],["a wake-up call","hồi chuông cảnh tỉnh"]]},{"part":3,"q":"Why do many people find it hard to stay healthy?","cue":null,"a":"I think modern work is the main obstacle. Many people have a [[sedentary lifestyle]] — they sit at a desk all day and then sit in traffic on the way home. Unhealthy food is also cheaper and more convenient than cooking. My colleagues, for instance, often order fried food for lunch because they don't have time to go out. Still, I believe small changes, like walking during phone calls, can make a real difference.","n":"PEER: Point (công việc hiện đại) → Explanation (ngồi nhiều + đồ ăn tiện) → Example (đồng nghiệp) → Redirection (\"Still…\" đưa giải pháp nhỏ). Có dấu gạch ngang giải thích thêm khi nói.","vocab":[["sedentary lifestyle","lối sống ít vận động"]]},{"part":3,"q":"Should famous athletes be role models for young people?","cue":null,"a":"In many ways, yes, because they show what discipline and hard work can achieve. A [[dedicated athlete]] trains for years before winning anything, which is a great lesson for teenagers. However, being good at sport doesn't automatically make someone a good person, and some athletes behave badly off the field. So I think young people should admire their effort rather than copy everything they do.","n":"PEER: Point → Explanation (kỷ luật) → Example ngắn → Redirection (\"However…\") + kết luận \"admire their effort rather than copy everything\" — quan điểm cân bằng rõ ràng.","vocab":[["dedicated athlete","vận động viên tận tuỵ"]]}]}]};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LV = { basic: "Band 4–5", intermediate: "Band 5.5–6.5", advanced: "Band 7+" };
const ICON = {
  "sp-people": '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/>',
  "sp-leisure": '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
  "sp-study-work": '<path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M7 10v5c0 1.7 2.2 3 5 3s5-1.3 5-3v-5"/>',
  "sp-tech-media": '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 17h2"/>',
  "sp-experiences": '<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/>',
  "sp-home": '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
  "sp-travel": '<path d="M2.5 16l19-7-2-3-6 2.5L7 4 5 5l4 5-4 1.5-2-1-1 1z"/><path d="M3 20h18"/>',
  "sp-nature": '<path d="M5 21c0-9 6-15 15-16-1 9-7 15-15 16z"/><path d="M5 21l8-8"/>',
  "sp-shopping": '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  "sp-culture": '<path d="M4 20h16M6 20V10M10 20V10M14 20V10M18 20V10M3 10l9-6 9 6z"/>',
  "sp-health": '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'
};
const svg = d => '<svg viewBox="0 0 24 24" aria-hidden="true">' + d + "</svg>";
const SPK = svg('<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a3 3 0 0 1 0 6"/>');
let S = { t: null, tab: "cues", lv: "all", hideM: false, tryFirst: false, open: {} };

function route() {
  const h = new URLSearchParams(location.hash.slice(1));
  S.t = DATA.topics.find(t => t.id === h.get("t")) || null;
  S.tab = ["cues", "words", "models"].includes(h.get("tab")) ? h.get("tab") : "models";
  render(); window.scrollTo(0, 0);
}
const go = (t, tab) => { location.hash = t ? "t=" + t + (tab ? "&tab=" + tab : "") : ""; };
function say(text) { try { const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .92; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
const partName = p => "Part " + p;

function render() { S.t ? renderTopic() : renderHome(); }

function renderHome() {
  const nW = DATA.topics.reduce((a, t) => a + t.words.length, 0), nM = DATA.topics.reduce((a, t) => a + t.models.length, 0);
  $("#hero").innerHTML = `<span class="eyebrow">AZIELTS Academy · Speaking</span><h1>IELTS Speaking theo chủ đề hay ra</h1>
    <p>${DATA.topics.length} nhóm chủ đề gộp từ các đề thường gặp trong sách Speaking AZ đang dùng. Mỗi chủ đề có đề thường gặp, ${Math.round(nW / DATA.topics.length)} từ/cụm hay dùng và bài mẫu Part 1–2–3 kèm phân tích.</p>`;
  $("#app").innerHTML = `<div class="card"><h2>Học một chủ đề trong 3 bước</h2>
      <div class="how"><div><b>1</b><span><strong>Đề thường gặp</strong> — biết giám khảo hay hỏi gì ở Part 1, 2, 3.</span></div>
      <div><b>2</b><span><strong>Từ vựng</strong> — ${nW} cụm theo 3 mức band, luyện trắc nghiệm ngay.</span></div>
      <div><b>3</b><span><strong>Bài mẫu</strong> — ${nM} câu trả lời mẫu, tự nói trước rồi đối chiếu phân tích PEER.</span></div></div></div>
    <div class="grid" id="grid">${DATA.topics.map((t, i) => `<button class="tc" type="button" data-t="${t.id}">
      <span class="ic">${svg(ICON[t.id] || ICON["sp-experiences"])}</span>${i < 4 ? '<span class="hot">Hay ra</span>' : ""}
      <b>${esc(t.vi)}</b><span class="muted small">${esc(t.en)}</span>
      <span class="meta">${t.cues.length} đề trong sách · ${t.words.length} từ · ${t.models.length} bài mẫu</span></button>`).join("")}</div>
    <p class="foot">Bài mẫu và từ vựng do AZEnglish tự biên soạn, đang chờ giáo viên duyệt. Câu hỏi lấy theo chủ đề hay ra trong sách "Speaking 3 Parts" (Ngọc Bách) và "Collins Speaking for IELTS". Không phải tài liệu chính thức của IELTS, Cambridge hay IDP.</p>`;
  $("#grid").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (b) go(b.dataset.t, "models"); });
}

function renderTopic() {
  const t = S.t;
  $("#hero").innerHTML = `<button class="crumb" type="button" id="home">← Tất cả chủ đề</button><span class="eyebrow" style="display:block">AZ Speaking · ${t.cues.length} đề trong sách</span>
    <h1>${esc(t.vi)}</h1><p>${esc(t.en)} · ${t.words.length} từ/cụm · ${t.models.length} bài mẫu</p>
    <div class="tabs" role="tablist">${[["models", "Bài mẫu & phân tích"], ["words", "Từ vựng"], ["cues", "Đề thường gặp"]].map(([k, l]) => `<button type="button" data-tab="${k}" aria-pressed="${S.tab === k}">${l}</button>`).join("")}</div>`;
  $("#home").onclick = () => go(null);
  $("#hero .tabs").onclick = e => { const b = e.target.closest("[data-tab]"); if (b) go(t.id, b.dataset.tab); };
  const body = S.tab === "cues" ? cuesHtml(t) : S.tab === "words" ? wordsHtml(t) : modelsHtml(t);
  $("#app").innerHTML = body + nextHtml(t);
  bindTopic(t);
}

function cuesHtml(t) {
  const kind = c => /^Part 1/.test(c) ? ["P1", ""] : /^Part 2/.test(c) ? ["P2", "p2"] : ["Sách", "c"];
  return `<div class="card"><h2>Đề thường gặp</h2><p class="muted small">Các chủ đề Part 1 và đề Part 2 trong sách được gộp vào nhóm này. Part 3 thường hỏi mở rộng từ đề Part 2 — xem câu hỏi Part 3 ở tab Bài mẫu.</p>
    <ul class="cues">${t.cues.map(c => { const [k, cl] = kind(c); return `<li><span class="pt ${cl}">${k}</span><span>${esc(c.replace(/^(Part \d|Collins [^:]*):\s*/, m => /Collins/.test(m) ? m : ""))}</span></li>`; }).join("")}</ul></div>`;
}

function wordsHtml(t) {
  const ws = t.words.filter(w => S.lv === "all" || w[3] === S.lv);
  return `<div class="card ${S.hideM ? "hide-m" : ""}" id="wcard"><h2>Từ vựng chủ đề</h2>
    <p class="muted small">Cụm hay dùng khi nói về chủ đề này, chia 3 mức band. Bật "Che nghĩa" để tự kiểm tra, chạm vào dòng để hiện lại.</p>
    <div class="bar2">${[["all", "Tất cả"], ["basic", LV.basic], ["intermediate", LV.intermediate], ["advanced", LV.advanced]].map(([k, l]) => `<button class="chip" type="button" data-lv="${k}" aria-pressed="${S.lv === k}">${l}</button>`).join("")}
      <button class="chip" type="button" id="hideM" aria-pressed="${S.hideM}">Che nghĩa</button></div>
    <div class="words">${ws.map(w => `<div class="w"><span><span class="t" lang="en">${esc(w[0])}</span><button class="say" type="button" data-say="${esc(w[0])}" aria-label="Nghe ${esc(w[0])}">${SPK}</button></span>
      <span class="lv ${w[3]}">${LV[w[3]]}</span><span class="m">${esc(w[1])}</span><span class="e" lang="en">${esc(w[2])}</span></div>`).join("")}</div>
    <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="vocabulary.html?skill=speaking&topic=${t.id}">Luyện trắc nghiệm ${t.words.length} từ</a></div></div>`;
}

// câu trả lời: thoát HTML rồi mới tô [[cụm]] → an toàn với mọi nội dung
function ansHtml(m) {
  const g = {}; m.vocab.forEach(([p, gl]) => { g[p.toLowerCase()] = gl; });
  return m.a.split("<br>").map(par => "<p>" + esc(par).replace(/\[\[(.+?)\]\]/g, (_, p) => `<mark title="${esc(g[p.toLowerCase()] || "")}">${p}</mark>`) + "</p>").join("");
}
function modelsHtml(t) {
  const parts = [1, 2, 3];
  return `<div class="card"><div class="bar2" style="justify-content:space-between"><h2 style="margin:0">Bài mẫu & phân tích</h2>
      <button class="chip" type="button" id="tryFirst" aria-pressed="${S.tryFirst}">Tự trả lời trước</button></div>
    <p class="muted small">Cụm <mark style="background:var(--gold-soft);border-bottom:2px solid var(--gold);padding:0 3px;border-radius:4px;color:var(--navy);font-weight:700">tô vàng</mark> là từ vựng chủ đề (rê chuột hoặc xem bảng bên dưới). Part 1 trả lời 2–3 câu (P–E–E), Part 2 nói đủ 2 phút theo gợi ý, Part 3 dùng PEER: Point – Explanation – Example – Redirection.</p>
    <div class="mnav">${parts.map(p => `<a class="chip" href="#m-p${p}" style="text-decoration:none;color:inherit">${partName(p)} · ${t.models.filter(m => m.part === p).length} câu</a>`).join("")}</div>
    ${t.models.map((m, i) => {
      const key = t.id + i, shown = !S.tryFirst || S.open[key];
      return `<section class="model" ${t.models.findIndex(x => x.part === m.part) === i ? `id="m-p${m.part}"` : ""}>
        <div class="qline"><span class="pt ${m.part === 2 ? "p2" : ""}">P${m.part}</span><span class="q" lang="en">${esc(m.q)}</span></div>
        ${m.cue ? `<div class="cue" lang="en"><b>You should say</b><ul>${m.cue.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
        ${shown ? `<div class="ans" lang="en">${ansHtml(m)}</div>
          <div class="ana"><div><h4>Phân tích</h4><p>${esc(m.n)}</p></div>
          <div><h4>Từ vựng trong bài</h4><ul>${m.vocab.map(([p, gl]) => `<li><b lang="en">${esc(p)}</b> — ${esc(gl)}</li>`).join("") || '<li class="muted">—</li>'}</ul></div></div>
          <p class="tip"><button class="say" type="button" data-say-model="${i}" aria-label="Nghe bài mẫu">${SPK}</button> Nghe bài mẫu bằng giọng đọc của thiết bị</p>`
        : `<div class="try">${m.part === 2 ? "Chuẩn bị 1 phút, nói 2 phút" : m.part === 1 ? "Nói 2–3 câu" : "Nói 4–5 câu theo PEER"} rồi mới xem bài mẫu.<br><button class="btn dark" type="button" data-open="${key}">Xem bài mẫu</button></div>`}
      </section>`; }).join("")}</div>`;
}
function nextHtml(t) {
  const i = DATA.topics.indexOf(t), n = DATA.topics[(i + 1) % DATA.topics.length];
  return `<div class="card" style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><span class="eyebrow" style="color:var(--gold)">Chủ đề tiếp theo</span><h3 style="margin:4px 0 0;font-family:var(--serif);font-size:20px;color:var(--navy)">${esc(n.vi)}</h3></div>
    <button class="btn line" type="button" data-next="${n.id}">Học tiếp →</button></div>`;
}
function bindTopic(t) {
  const app = $("#app");
  app.onclick = e => {
    const b = e.target.closest("button,[data-lv],.w");
    if (!b) return;
    if (b.dataset.lv) { S.lv = b.dataset.lv; renderTopic(); return; }
    if (b.id === "hideM") { S.hideM = !S.hideM; renderTopic(); return; }
    if (b.id === "tryFirst") { S.tryFirst = !S.tryFirst; S.open = {}; renderTopic(); return; }
    if (b.dataset.open) { S.open[b.dataset.open] = true; renderTopic(); document.querySelectorAll(".model")[+b.dataset.open.slice(t.id.length)].scrollIntoView({ block: "start" }); return; }
    if (b.dataset.say) { say(b.dataset.say); return; }
    if (b.dataset.sayModel) { const m = t.models[+b.dataset.sayModel]; say(m.a.replace(/<br>/g, " ").replace(/\[\[|\]\]/g, "")); return; }
    if (b.dataset.next) { go(b.dataset.next, S.tab); return; }
    if (b.classList.contains("w") && S.hideM) b.style.cssText = "";   // giữ che: chạm để xem nhanh qua class
    if (b.classList.contains("w") && S.hideM) b.querySelectorAll(".m,.e").forEach(x => { x.style.filter = "none"; });
  };
}
window.addEventListener("hashchange", route);
window.AZR = { b: ".card,.tc", s: "", x: ".ans,.try" };
route();
</script>
<script>/* AZIELTS · hiệu ứng hiện dần khi kéo trang (dùng chung mọi trang, quyết định 26/10/2026).
   Khối (AZR.b) trượt lên khi tới nơi; nhóm nhiều ô (AZR.s) cho các ô con hiện LẦN LƯỢT. Mỗi khối chạy 1 lần.
   Bỏ qua: máy bật giảm chuyển động, phần nằm trong AZR.x, và khối chứa ô gõ bài (textarea) — màn làm bài không có hiệu ứng.
   Cấu hình trước khi nạp: window.AZR = { b: "selector khối", s: "selector nhóm ô", x: "selector vùng loại trừ" }. Nội dung vẽ sau (innerHTML) tự được gắn. */
(function () {
  var C = window.AZR || {}, B = C.b || "", S = C.s || "", X = C.x || "";
  if (!("IntersectionObserver" in window) || !window.matchMedia || matchMedia("(prefers-reduced-motion: reduce)").matches || (!B && !S)) return;

  st.textContent = ".azr{opacity:0;transform:translateY(28px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)!important}.azr.azin{opacity:1;transform:none}";
  document.head.appendChild(st);
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (!e.isIntersecting) return; var el = e.target; io.unobserve(el); el.classList.add("azin");
      setTimeout(function () { el.classList.remove("azr", "azin"); el.style.transitionDelay = ""; }, 700 + (parseInt(el.style.transitionDelay) || 0)); });
  }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
  function skip(el) { return el.dataset.azr || (X && el.closest(X)) || el.querySelector("textarea"); }
  function mark(el, delay) { el.dataset.azr = "1"; el.classList.add("azr"); if (delay) el.style.transitionDelay = delay + "ms"; io.observe(el); }
  function tag(root) {
    if (!root || !root.querySelectorAll) return;
    if (B) root.querySelectorAll(B).forEach(function (el) { if (!skip(el)) mark(el, 0); });
    if (S) root.querySelectorAll(S).forEach(function (p) { var i = 0; Array.prototype.forEach.call(p.children, function (c) { if (!skip(c)) mark(c, Math.min(i++, 8) * 70); }); });
  }
  function start() {
    tag(document);
    var q = new Set(), on = false;   // gộp các lần trang vẽ lại vào 1 nhịp khung hình
    new MutationObserver(function (ms) { ms.forEach(function (m) { if (m.addedNodes.length) q.add(m.target); });
      if (!on && q.size) { on = true; requestAnimationFrame(function () { on = false; var t = Array.from(q); q.clear(); t.forEach(function (r) { if (r.isConnected) tag(r); }); }); } }).observe(document.body, { childList: true, subtree: true });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
