<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AZ Speaking · AZIELTS Academy</title>
<meta name="description" content="IELTS Speaking theo 11 nhóm chủ đề hay ra: đề thường gặp, từ vựng theo chủ đề, bài mẫu Part 1–2–3 kèm phân tích và từ vựng.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
<style>
/* Giao diện Premium AZIELTS (luôn sáng) — cùng khung Day Mission / Skill Mission / AZ Vocabulary:
   thanh đầu + dải hero xanh đêm, thẻ trắng nổi đè lên dải, khung 920px. Đỏ AZ chỉ cho nút chính. */
:root{color-scheme:light;--bg:#FAF8F4;--card:#FFFFFF;--ink:#111827;--ink-2:#4B5563;--ink-3:#8A93A3;--line:#E4E7EC;--line-2:#D3D8E0;
  --navy:#0B1424;--navy-2:#13233B;--gold:#B8913A;--gold-2:#D9B36A;--gold-soft:#FBF3E0;--red:#D7192D;--red-d:#B01322;--ok:#15803D;--ok-soft:#E8F5EC;
  --f:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Playfair Display",Georgia,serif;
  --sh:0 2px 6px rgba(16,24,40,.06),0 24px 48px -24px rgba(11,20,36,.35);--band:linear-gradient(160deg,#0B1424,#13233B 60%,#0E1A2E)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--f);font-size:15.5px;line-height:1.6;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;cursor:pointer;color:inherit}[hidden]{display:none!important}
a{color:var(--red)}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid rgba(215,25,45,.35);outline-offset:2px}
/* thanh đầu */
.top{background:var(--band);color:#F4F1EA;padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:17px}
.logo .mk{width:34px;height:34px;border-radius:10px;background:var(--red);display:grid;place-items:center;font-size:13px}
.logo small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);font-weight:700;line-height:1.1}
.sp{flex:1}.back{color:var(--gold-2);font-weight:700;text-decoration:none;font-size:14px;white-space:nowrap}
/* dải hero */
.hero{color:#F4F1EA;background:radial-gradient(900px 420px at 90% -10%,rgba(215,25,45,.22),transparent 60%),radial-gradient(700px 400px at 0% 120%,rgba(184,145,58,.18),transparent 60%),var(--band)}
.hero .wrap{padding-top:18px;padding-bottom:86px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-2);font-weight:700}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1.12;margin:8px 0 6px;color:#fff;text-wrap:balance}
.hero p{margin:0;color:#C9CFDA;max-width:64ch}
.crumb{background:none;border:0;padding:0;color:var(--gold-2);font-weight:700;font-size:14px;margin-bottom:6px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tabs button{border:1px solid rgba(217,179,106,.45);background:rgba(255,255,255,.06);color:#F4F1EA;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
main.wrap{margin-top:-62px;position:relative;padding-bottom:48px}
/* thẻ */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh);padding:clamp(20px,3.6vw,32px);margin-bottom:18px}
h2{font-family:var(--serif);font-size:clamp(22px,3vw,28px);line-height:1.15;color:var(--navy);margin:0 0 6px}
h3{font-size:16px;margin:0 0 10px;color:var(--ink)}
.muted{color:var(--ink-2)}.small{font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border:1px solid var(--red);border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.btn:hover{background:var(--red-d)}.btn.line{background:#fff;color:var(--ink);border-color:var(--line-2)}.btn.line:hover{background:#F3F4F6}
.btn.dark{background:var(--navy);border-color:var(--navy)}
/* trang chủ: cách học + lưới chủ đề */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.how div{padding:14px 16px;border-radius:14px;background:#F7F5F0}
.how b{display:block;font-family:var(--serif);font-size:22px;color:var(--gold)}
.how span{font-size:14px;color:var(--ink-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tc{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(16,24,40,.04);transition:transform .12s,box-shadow .12s;min-height:150px}
.tc:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.tc .ic{width:42px;height:42px;border-radius:12px;background:var(--gold-soft);display:grid;place-items:center;color:#7A5B12}
.tc .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tc b{font-size:16.5px;color:var(--navy);line-height:1.3}
.tc .meta{margin-top:auto;font-size:13px;color:var(--ink-3);font-weight:600}
.hot{align-self:flex-start;font-size:11.5px;font-weight:700;color:#7A5B12;background:var(--gold-soft);padding:2px 9px;border-radius:999px}
/* đề thường gặp */
.cues{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.cues li{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#F7F5F0}
.pt{flex:none;font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:8px;padding:2px 8px;margin-top:2px}
.pt.p2{background:var(--gold)}.pt.c{background:#6B7280}
/* từ vựng */
.bar2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;min-height:40px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.words{display:grid;gap:10px}
.w{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
.w .t{font-weight:800;color:var(--navy);font-size:16px}
.w .m{color:var(--ink);font-weight:600}
.w .e{grid-column:1/-1;color:var(--ink-2);font-size:14.5px;font-style:italic}
.w .lv{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#F3F4F6;color:var(--ink-2);align-self:start;white-space:nowrap}
.w .lv.advanced{background:var(--gold-soft);color:#7A5B12}
.say{border:1px solid var(--line-2);background:#fff;border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px}
.say svg{width:16px;height:16px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide-m .w .m,.hide-m .w .e{filter:blur(6px);cursor:pointer}
/* bài mẫu */
.mnav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.model{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.model:first-of-type{border-top:0;padding-top:0;margin-top:0}
.qline{display:flex;gap:10px;align-items:flex-start}
.qline .q{font-weight:700;font-size:17px;line-height:1.45;color:var(--ink)}
.cue{margin:10px 0 0;padding:12px 16px;border-radius:12px;border:1.5px dashed var(--gold);background:var(--gold-soft);font-size:14.5px}
.cue b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#7A5B12}
.cue ul{margin:4px 0 0;padding-left:18px}
.ans{margin-top:12px;padding:16px 18px;border-radius:14px;background:#F7F5F0;border-left:4px solid var(--gold);font-size:16px;line-height:1.75}
.ans p{margin:0 0 10px}.ans p:last-child{margin:0}
.ans mark{background:var(--gold-soft);color:var(--navy);font-weight:700;border-radius:4px;padding:0 3px;cursor:help;border-bottom:2px solid var(--gold)}
.try{margin-top:12px;padding:16px;border-radius:14px;border:1.5px dashed var(--line-2);text-align:center;color:var(--ink-2)}
.try .btn{margin-top:10px}
.ana{margin-top:12px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
.ana>div{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#fff}
.ana h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.ana p{margin:0;font-size:14.5px;color:var(--ink-2)}
.ana ul{margin:0;padding:0;list-style:none;font-size:14.5px}
.ana li{padding:3px 0;border-bottom:1px dashed var(--line)}.ana li:last-child{border:0}
.ana li b{color:var(--navy)}
.tip{font-size:13.5px;color:var(--ink-3);margin-top:8px}
.foot{font-size:13px;color:var(--ink-3);padding:6px 4px}
@media (max-width:700px){.how{grid-template-columns:1fr}.ana{grid-template-columns:1fr}.top .back{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== AZIELTS SYNC — một thang chung cho Academy · Writing Studio · Reading & Listening · Listening Lab =====
   Bo góc: 10px nút & ô nhập · 12px khối nhỏ bên trong thẻ · 16px thẻ & bảng · 20px khung lớn · 999px viên thuốc (chip, nhãn gói).
   Nút: chữ thường, đậm 700, không giãn chữ. Biểu tượng: nét mảnh 1.8. */
:root{--r-btn:10px;--r-in:12px;--r-card:16px;--r-xl:20px}
/* nút & ô nhập */
html body :is(.btn,.ghost,.nb-btn,.opt,#chk,#rst,.ws-steps button,#tabs button,select,textarea,input:not([type=checkbox]):not([type=radio]):not([type=range])):not(.mchip):not(.avatar):not(.tab):not(.azp-home){border-radius:var(--r-btn)!important}
html body :is(.btn,.ghost,.nb-btn,#chk,#rst):not(.tab){font-weight:700!important;letter-spacing:0!important;text-transform:none!important}
html body .ws-steps button{font-weight:700!important}
/* khối nhỏ bên trong thẻ */
html body :is(.nb-book,.ph,.how,.board-note,.essay-raw,details.faq-i,.faq details,.ico,.ti){border-radius:var(--r-in)!important}
/* thẻ & bảng */
html body :is(.panel,.wk-it,.figure,nav#tabs,.ws-steps,.jmap,.rc,.pgrid,.tch,.plan,.perk,.stats,.float,.acct,.auth,.place,.step,.nb-skill,.nb-writing,.nb-strategy,.nb-stats,.nb-panel,.bk,.card,.steps,.player,.transcript,.app){border-radius:var(--r-card)!important}
/* khung lớn */
html body :is(aside.side,.frame,.nb-hero,.az-hero,header.top,.hello,.hero-card){border-radius:var(--r-xl)!important}
/* biểu tượng nét mảnh */
html body :is(.azi,.nb-skill .ico svg,.nb-strategy .i svg,.azp-ico){stroke-width:1.8!important}
html body .nb-strategy .i svg,html body .azp-ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
html body .azp-ico{width:18px;height:18px;vertical-align:-3px;margin-right:8px;color:var(--gold,#B8913A)}
html body .nb-strategy .i svg{margin:0!important;color:inherit!important}
html body a.card > .tn{display:flex;align-items:center}

</style>
</head>

<script>
const DATA = {"topics":[{"id":"sp-people","en":"People and relationships","vi":"Con người và các mối quan hệ","cues":["Part 2: Describe your favorite singer or actor","Part 2: Describe a businessperson that you admire","Part 2: Describe a time you were friendly to someone you didn't like","Part 2: Describe a person who solved a problem in a smart way","Part 2: Describe a time when you saw two of your friends argued","Part 2: Describe a time you helped a friend","Part 2: Describe an older person that you admire","Part 2: Describe a foreign person who you think is interesting","Part 2: Describe a famous athlete you know","Part 2: Describe a creative person whose work you admire","Part 2: Describe a time when you felt proud of a family member","Part 2: Describe a person who impressed you most when you were in primary school","Part 2: Describe a habit your friend has and you want to develop","Collins Unit 1: People and relationships (Family matters)"],"words":[["get on well with","hợp tính, hoà thuận với","I get on well with my younger sister because we like the same things.","basic"],["close friend","bạn thân","My close friend lives just two streets away from me.","basic"],["look up to","ngưỡng mộ, kính trọng","I have always looked up to my grandfather.","basic"],["take after","giống (bố mẹ, ông bà)","People say I take after my mother.","basic"],["spend time with","dành thời gian bên","I try to spend time with my parents at the weekend.","basic"],["kind-hearted","tốt bụng","My neighbour is a really kind-hearted woman.","basic"],["outgoing","hướng ngoại, cởi mở","My best friend is very outgoing, so she makes friends easily.","basic"],["shy","nhút nhát","I was quite shy when I was a child.","basic"],["keep in touch","giữ liên lạc","We still keep in touch even though he moved to Hanoi.","basic"],["grow up together","lớn lên cùng nhau","We grew up together in the same neighbourhood.","basic"],["have a lot in common","có nhiều điểm chung","We have a lot in common, especially our love of football.","basic"],["only child","con một","As an only child, I spent a lot of time with my cousins.","basic"],["extended family","đại gia đình","My extended family gets together every Lunar New Year.","basic"],["down-to-earth","giản dị, thực tế","Despite being famous, she is very down-to-earth.","intermediate"],["easy-going","dễ tính","My dad is easy-going and rarely gets angry.","intermediate"],["a good listener","người biết lắng nghe","My best friend is a good listener when I have problems.","intermediate"],["lose touch with","mất liên lạc với","I lost touch with most of my primary school friends.","intermediate"],["fall out with","cãi nhau, bất hoà với","I fell out with my roommate over something silly.","intermediate"],["make up","làm lành","They argued in the morning but made up by lunchtime.","intermediate"],["a role model","tấm gương","My aunt is a role model for me because she works so hard.","intermediate"],["strong-willed","có ý chí mạnh mẽ","She is strong-willed and never gives up.","intermediate"],["supportive","luôn ủng hộ, động viên","My parents have always been supportive of my choices.","intermediate"],["a sense of humour","khiếu hài hước","He has a great sense of humour and makes everyone laugh.","intermediate"],["lend a hand","giúp một tay","I offered to lend a hand when my friend moved house.","intermediate"],["be there for someone","luôn ở bên ai đó","A true friend is someone who is there for you in difficult times.","intermediate"],["generation gap","khoảng cách thế hệ","There is a big generation gap between me and my grandparents.","intermediate"],["admire someone for","ngưỡng mộ ai vì","I admire him for his honesty.","intermediate"],["inspire someone to","truyền cảm hứng cho ai làm gì","My teacher inspired me to study abroad.","intermediate"],["get on like a house on fire","hợp nhau ngay lập tức","We met at a summer camp and got on like a house on fire.","advanced"],["see eye to eye","đồng quan điểm","My brother and I don't always see eye to eye on politics.","advanced"],["a shoulder to cry on","chỗ dựa tinh thần","My best friend has always been a shoulder to cry on.","advanced"],["larger than life","nổi bật, cá tính mạnh","My uncle is a larger-than-life character at every party.","advanced"],["self-made","tự lập nghiệp, tự thân thành công","He is a self-made businessman who started with nothing.","advanced"],["level-headed","điềm tĩnh, sáng suốt","She stayed level-headed and solved the problem calmly.","advanced"],["tight-knit","gắn bó khăng khít","We are a tight-knit family and talk every day.","advanced"],["bury the hatchet","làm hoà, bỏ qua hiềm khích","After a year of silence, they finally buried the hatchet.","advanced"],["quick-witted","nhanh trí","He is quick-witted enough to find a solution in seconds.","advanced"],["leave a lasting impression","để lại ấn tượng sâu sắc","My first English teacher left a lasting impression on me.","advanced"],["a people person","người giỏi giao tiếp với mọi người","My mum is a real people person, so she loves her sales job.","advanced"]],"models":[{"part":1,"q":"Who do you get on best with in your family?","cue":null,"a":"Definitely my younger sister. We're only two years apart, so we [[grew up together]] and we [[have a lot in common]], especially our taste in music. Even now that she studies in another city, we [[keep in touch]] almost every day.","n":"P–E–E: trả lời thẳng (Point) → lý do \"two years apart\" (Explanation) → ví dụ hiện tại (Example). Dùng thì hiện tại hoàn thành ẩn trong \"even now that…\", 3 cụm quan hệ tự nhiên thay cho \"we are close\".","vocab":[["grew up together","lớn lên cùng nhau"],["have a lot in common","có nhiều điểm chung"],["keep in touch","giữ liên lạc"]]},{"part":1,"q":"Do you prefer spending time with friends or alone?","cue":null,"a":"It depends on my mood, to be honest. I'm fairly [[outgoing]], so at weekends I love to [[hang out with friends]]. But after a long week I sometimes need a quiet evening on my own just to [[recharge my batteries]].","n":"Mở bằng \"It depends…\" rồi cân hai phía — cách trả lời Part 1 linh hoạt, không cụt. Cụm \"recharge my batteries\" (band 6.5+) thay cho \"rest\".","vocab":[["outgoing","hướng ngoại, cởi mở"],["hang out with friends","đi chơi với bạn bè"],["recharge my batteries","nạp lại năng lượng"]]},{"part":1,"q":"Have you ever had an argument with a friend?","cue":null,"a":"Yes, once. In high school I [[fell out with]] my best friend over something really silly, a borrowed book I'd forgotten to return. We didn't speak for a week, but then I apologised and we [[made up]]. Looking back, it actually made our friendship stronger.","n":"Kể ngắn theo trình tự thời gian (P → câu chuyện → kết). \"Looking back,\" là cụm nối để rút ra bài học — ghi điểm Coherence. Dùng quá khứ hoàn thành \"I'd forgotten\".","vocab":[["fell out with","cãi nhau, bất hoà với"],["made up","làm lành"]]},{"part":2,"q":"Describe an older person that you admire","cue":["who this person is","how you know them","what this person does","and explain why you admire them"],"a":"I'd like to talk about my grandfather, who is now in his late seventies and still lives in our hometown. He's someone I have always [[looked up to]].<br>He was a primary school teacher for almost forty years, so half the town seems to know him. When I was small, I spent every summer at his house, and he taught me to play chess and to read the newspaper aloud.<br>Even after he retired, he didn't slow down. He runs a free English club for local kids every Sunday morning, and he grows vegetables that he gives away to the neighbours.<br>The main reason I admire him is his patience. He is incredibly [[level-headed]]; I have never once seen him lose his temper, even when my cousins and I broke his favourite vase. He also has [[a great sense of humour]], which makes him [[a people person]] that everybody enjoys being around.<br>More than anything, he showed me that learning never stops. He has definitely been [[a role model]] for me, and he [[left a lasting impression]] on the way I want to treat other people when I'm his age.","n":"Đi lần lượt 4 gợi ý của đề (who → how → what → why), mỗi đoạn 2–3 câu, nên giám khảo dễ theo dõi. Phần \"why\" dài nhất và có ví dụ cụ thể (chiếc bình vỡ) — đúng chỗ ăn điểm. Câu kết mở rộng ra bài học bản thân. Nói đủ 2 phút với khoảng 230 từ.","vocab":[["looked up to","ngưỡng mộ, kính trọng"],["level-headed","điềm tĩnh, sáng suốt"],["a great sense of humour","khiếu hài hước tuyệt vời"],["a people person","người giỏi giao tiếp với mọi người"],["a role model","tấm gương"],["left a lasting impression","để lại ấn tượng sâu sắc"]]},{"part":3,"q":"Do you think young people today respect older people less than in the past?","cue":null,"a":"I'd say the respect is still there, but it's expressed differently. In the past, young people mostly lived with their grandparents, so they showed respect through daily routines like serving meals. Nowadays many families live apart, so the [[generation gap]] feels wider. For instance, teenagers might text their grandparents rather than visit. However, I think technology can also bring them closer, because video calls let grandparents stay part of their grandchildren's lives.","n":"PEER đủ 4 bước: Point (vẫn tôn trọng nhưng khác cách) → Explanation (so sánh xưa–nay) → Example (nhắn tin thay vì thăm) → Redirection (\"However…\" mở góc nhìn công nghệ). Từ nối so sánh: In the past / Nowadays.","vocab":[["generation gap","khoảng cách thế hệ"]]},{"part":3,"q":"What qualities make someone a good friend?","cue":null,"a":"For me, the most important quality is loyalty. A good friend should [[be there for you]] when things go wrong, not only when life is fun. They also need to be [[a good listener]], because sometimes you just want someone to hear you out without judging. I had a friend who drove two hours to help me move house when nobody else could. That's why I believe friendship is measured by actions rather than words.","n":"PEER: Point (loyalty) → Explanation (hai phẩm chất) → Example (chuyện chuyển nhà) → Redirection dạng kết luận khái quát \"measured by actions rather than words\". Cấu trúc \"not only… but\" và \"rather than\" tăng điểm Ngữ pháp.","vocab":[["be there for you","luôn ở bên bạn"],["a good listener","người biết lắng nghe"]]}]},{"id":"sp-leisure","en":"Hobbies and free time","vi":"Sở thích và thời gian rảnh","cues":["Part 1: Relax","Part 1: Weekends","Part 1: BBQ","Part 1: Colors","Part 2: Describe a plan that has nothing to do with work and study","Part 2: Describe a puzzle you have played","Part 2: Describe a natural talent (sports, music, etc) you want to improve","Part 2: Describe a leisure activity near/on the sea that you want to try","Part 2: Describe an activity that you do after school/work","Part 2: Describe an art or craft activity you did when you were at school","Part 2: Describe an activity you usually do that wastes your time","Collins Unit 7: Hobbies"],"words":[["free time","thời gian rảnh","In my free time, I usually play badminton.","basic"],["hang out with friends","đi chơi với bạn bè","I like to hang out with friends at the weekend.","basic"],["go for a walk","đi dạo","I often go for a walk after dinner.","basic"],["play an instrument","chơi một nhạc cụ","I've always wanted to play an instrument.","basic"],["watch films","xem phim","I watch films to relax after work.","basic"],["take photos","chụp ảnh","I love taking photos of street food.","basic"],["go swimming","đi bơi","I go swimming three times a week in summer.","basic"],["a big fan of","rất thích, người hâm mộ","I'm a big fan of detective novels.","basic"],["listen to music","nghe nhạc","I listen to music on my way to school.","basic"],["stay at home","ở nhà","On rainy weekends, I just stay at home.","basic"],["have a barbecue","tổ chức nướng ngoài trời","We had a barbecue on the beach last summer.","basic"],["do puzzles","giải đố","My grandfather loves doing puzzles in the newspaper.","basic"],["try something new","thử điều gì mới","I want to try something new this year, like surfing.","basic"],["unwind","thư giãn, xả hơi","Reading helps me unwind after a long day.","intermediate"],["recharge my batteries","nạp lại năng lượng","I go to the beach to recharge my batteries.","intermediate"],["take up","bắt đầu (một sở thích)","I took up yoga last year.","intermediate"],["give up","bỏ (thói quen, sở thích)","I gave up the guitar because I didn't have time.","intermediate"],["get into","bắt đầu say mê","I got into photography during the pandemic.","intermediate"],["kill time","giết thời gian","I scroll through social media to kill time on the bus.","intermediate"],["a waste of time","phí thời gian","Watching random videos is a waste of time.","intermediate"],["a creative outlet","cách thể hiện sự sáng tạo","Painting is a creative outlet for me.","intermediate"],["lose track of time","quên cả thời gian","I lose track of time when I play video games.","intermediate"],["water sports","thể thao dưới nước","I'd love to try water sports like kayaking.","intermediate"],["a lazy weekend","cuối tuần lười biếng","I sometimes just enjoy a lazy weekend at home.","intermediate"],["brain teaser","câu đố hóc búa","I like brain teasers because they keep my mind sharp.","intermediate"],["handmade","làm thủ công","I once made a handmade card for my mum's birthday.","intermediate"],["be into","thích, mê","I'm really into Korean dramas at the moment.","intermediate"],["while away the hours","để thời gian trôi nhàn nhã","I can while away the hours in a bookshop.","advanced"],["a couch potato","người lười, chỉ nằm xem TV","I turn into a couch potato on Sundays.","advanced"],["let my hair down","thả lỏng, vui hết mình","Friday nights are when I let my hair down.","advanced"],["have a knack for","có năng khiếu về","My sister has a knack for drawing.","advanced"],["a natural flair for","tài năng bẩm sinh về","He has a natural flair for music.","advanced"],["therapeutic","có tác dụng chữa lành, giúp thư thái","Gardening is surprisingly therapeutic.","advanced"],["an adrenaline rush","cảm giác phấn khích tột độ","Paragliding gave me an adrenaline rush.","advanced"],["out of my comfort zone","ra khỏi vùng an toàn","Learning to dance pushed me out of my comfort zone.","advanced"],["mindless scrolling","lướt mạng vô thức","Mindless scrolling eats up hours of my day.","advanced"],["a bucket list","danh sách điều muốn làm trong đời","Scuba diving is on my bucket list.","advanced"],["rusty","lụt nghề, mai một","My piano skills are a bit rusty now.","advanced"],["pick up a new hobby","học một sở thích mới","I want to pick up a new hobby, maybe pottery.","advanced"]],"models":[{"part":1,"q":"What do you usually do at weekends?","cue":null,"a":"Saturdays are usually quite active for me. I play badminton in the morning and then [[hang out with friends]] in the afternoon. Sundays are the opposite; I just stay in, read a bit and [[unwind]] before the new week starts.","n":"Chia hai ngày đối lập (Saturdays… Sundays are the opposite) — một mẹo tổ chức câu trả lời Part 1 dễ áp dụng.","vocab":[["hang out with friends","đi chơi với bạn bè"],["unwind","thư giãn, xả hơi"]]},{"part":1,"q":"Do you have a hobby that you've had since childhood?","cue":null,"a":"Yes, drawing. I started when I was about six, and my parents say I [[have a knack for]] it. I [[gave up]] for a few years during high school because of exams, but I've recently picked it up again and I find it really [[therapeutic]].","n":"Đủ 3 mốc thời gian: quá khứ (started) → giai đoạn bỏ (gave up) → hiện tại (have recently picked it up) — thể hiện dùng thì đa dạng.","vocab":[["have a knack for","có năng khiếu về"],["gave up","đã bỏ"],["therapeutic","có tác dụng chữa lành, giúp thư thái"]]},{"part":1,"q":"Is there anything you spend too much time on?","cue":null,"a":"Honestly, my phone. I tend to scroll through short videos to [[kill time]] on the bus, but then I [[lose track of time]] and suddenly an hour has gone. So now I'm trying to replace that habit with podcasts.","n":"Thừa nhận thật (\"Honestly\") + giải thích + giải pháp. Hai cụm thời gian đi cặp kill time / lose track of time rất tự nhiên.","vocab":[["kill time","giết thời gian"],["lose track of time","quên cả thời gian"]]},{"part":2,"q":"Describe a leisure activity near or on the sea that you want to try","cue":["what the activity is","where you would like to do it","who you would do it with","and explain why you want to try it"],"a":"The activity I'd love to try is scuba diving, and it has been on [[my bucket list]] for years.<br>The place I have in mind is Nha Trang, which is famous for its clear water and coral reefs around the islands. I've seen photos of divers swimming next to schools of colourful fish, and it looks like another world.<br>I'd want to go with my cousin, who is a qualified diving instructor. I'm a bit nervous about deep water, so having someone I trust beside me would make me feel much safer.<br>There are a few reasons I want to try it. First, I spend most of my week in front of a screen, so I'm craving something completely different. Second, I think it would push me [[out of my comfort zone]], because I'm not a confident swimmer. And finally, I've heard that being underwater is incredibly calm and [[therapeutic]] — there's no phone, no noise, just your breathing.<br>I imagine I'd get [[an adrenaline rush]] on the first dive, but I'm sure it would be a once-in-a-lifetime experience that I'd remember forever.","n":"Đúng 4 gợi ý. Phần lý do dùng First / Second / And finally — tín hiệu mạch lạc rõ cho Coherence. Thể hiện câu điều kiện giả định (\"would make me feel safer\", \"I'd remember\") vì đây là việc CHƯA làm — lỗi hay gặp là dùng thì quá khứ.","vocab":[["my bucket list","danh sách điều muốn làm trong đời"],["out of my comfort zone","ra khỏi vùng an toàn"],["therapeutic","có tác dụng chữa lành, giúp thư thái"],["an adrenaline rush","cảm giác phấn khích tột độ"]]},{"part":3,"q":"Why do some people prefer staying at home in their free time?","cue":null,"a":"I think the main reason is exhaustion. Many people work long hours, so by the weekend they simply want to rest rather than deal with traffic and crowds. Home entertainment has also improved enormously; with streaming services you can watch a film in better quality than at some cinemas. My own parents, for example, almost never go out on Sundays now. That said, I feel staying in too much can make people isolated, so a balance is probably healthiest.","n":"PEER: Point (mệt mỏi) → Explanation (hai lý do, nối bằng \"also\") → Example (bố mẹ) → Redirection (\"That said…\" chỉ ra mặt trái). \"That said\" là cách nhượng bộ tự nhiên khi nói.","vocab":[]},{"part":3,"q":"Do you think hobbies are important for children?","cue":null,"a":"Absolutely. Hobbies give children a [[creative outlet]] and teach them skills that school often doesn't, like patience and teamwork. Take learning an instrument: a child has to practise every day and accept making mistakes. On the other hand, parents shouldn't overload them with classes, otherwise a hobby turns into another kind of homework.","n":"PEER: Point (Absolutely) → Explanation (kỹ năng ngoài trường) → Example (\"Take learning an instrument…\" — cách đưa ví dụ ngắn gọn) → Redirection (\"On the other hand…\").","vocab":[["creative outlet","cách thể hiện sự sáng tạo"]]}]},{"id":"sp-study-work","en":"Study and work","vi":"Học tập và công việc","cues":["Part 1: Study","Part 1: Work","Part 1: Concentration","Part 1: Handwriting","Part 1: Technology in your work","Part 1: Science","Part 2: Describe a course you like","Part 2: Describe a skill that was difficult for you to learn","Part 2: Describe a company where you live that employs a lot of people","Collins Unit 3: Studies and work (Education)","Collins Unit 7: Employment and finances"],"words":[["my major","chuyên ngành của tôi","My major is business administration.","basic"],["take an exam","đi thi","I have to take an exam every month at my English centre.","basic"],["part-time job","việc làm bán thời gian","I have a part-time job in a coffee shop.","basic"],["work long hours","làm việc nhiều giờ","My father works long hours at the factory.","basic"],["favourite subject","môn học yêu thích","My favourite subject at school was geography.","basic"],["study hard","học chăm chỉ","I need to study hard to get a band 7.","basic"],["pass with flying colours","đỗ với điểm cao","I passed my driving test with flying colours.","basic"],["colleague","đồng nghiệp","My colleagues are friendly and helpful.","basic"],["earn a living","kiếm sống","My uncle earns a living as a taxi driver.","basic"],["do my homework","làm bài tập về nhà","I usually do my homework after dinner.","basic"],["first job","công việc đầu tiên","My first job was teaching English to kids.","basic"],["work from home","làm việc tại nhà","I work from home two days a week.","basic"],["learn by heart","học thuộc lòng","We had to learn the poem by heart.","basic"],["hit the books","vùi đầu vào học","I need to hit the books before the final exam.","intermediate"],["lose concentration","mất tập trung","I lose concentration easily when my phone is nearby.","intermediate"],["meet a deadline","kịp hạn chót","I stayed up late to meet a deadline.","intermediate"],["a heavy workload","khối lượng công việc nặng","Teachers have a heavy workload these days.","intermediate"],["job satisfaction","sự hài lòng với công việc","For me, job satisfaction is more important than salary.","intermediate"],["career path","con đường sự nghiệp","I'm still deciding on my career path.","intermediate"],["hands-on experience","kinh nghiệm thực tế","The internship gave me hands-on experience.","intermediate"],["fall behind","bị tụt lại phía sau","I fell behind when I was sick for two weeks.","intermediate"],["catch up on","bắt kịp, làm bù","I spent the weekend catching up on my reading.","intermediate"],["a steep learning curve","giai đoạn học rất vất vả lúc đầu","Learning to code was a steep learning curve for me.","intermediate"],["work-life balance","cân bằng công việc và cuộc sống","I try to keep a healthy work-life balance.","intermediate"],["team player","người làm việc nhóm tốt","My boss says I'm a good team player.","intermediate"],["get promoted","được thăng chức","She got promoted after only two years.","intermediate"],["major employer","đơn vị tuyển dụng lớn","The shoe factory is a major employer in my town.","intermediate"],["burn the midnight oil","thức khuya làm việc/học","I burned the midnight oil to finish my thesis.","advanced"],["a nine-to-five job","công việc hành chính giờ cố định","I don't want a nine-to-five job; I prefer flexible hours.","advanced"],["climb the career ladder","thăng tiến trong sự nghiệp","Many young people want to climb the career ladder quickly.","advanced"],["learn the ropes","học cách làm việc từ đầu","It took me a month to learn the ropes at my new job.","advanced"],["be snowed under","ngập đầu trong công việc","I'm snowed under with assignments this week.","advanced"],["a quick learner","người học nhanh","I'm a quick learner, so I picked up the software easily.","advanced"],["in-depth knowledge","kiến thức chuyên sâu","The course gave me in-depth knowledge of marketing.","advanced"],["thought-provoking","kích thích suy nghĩ","The lectures were really thought-provoking.","advanced"],["cut out for","phù hợp với (nghề, việc)","I'm not cut out for a desk job.","advanced"],["rote learning","học vẹt","Our school system still relies too much on rote learning.","advanced"],["wear many hats","kiêm nhiều vai trò","In a small company, you have to wear many hats.","advanced"],["a golden opportunity","cơ hội vàng","The scholarship was a golden opportunity for me.","advanced"]],"models":[{"part":1,"q":"Do you work or are you a student?","cue":null,"a":"I'm a third-year student at a university in Ho Chi Minh City. [[My major]] is marketing, which I chose because I enjoy understanding why people buy things. I also have a [[part-time job]] at a coffee shop, so my weeks are pretty busy.","n":"Trả lời đúng câu hỏi trong câu đầu, sau đó thêm 2 chi tiết (chuyên ngành + việc làm thêm) để không bị cụt. Đây là câu mở đầu bài thi — nói tự tin, không cần dài.","vocab":[["My major","chuyên ngành của tôi"],["part-time job","việc làm bán thời gian"]]},{"part":1,"q":"What do you find difficult about your studies?","cue":null,"a":"The hardest part is managing deadlines. Some weeks I have three assignments due at once, and I end up [[burning the midnight oil]]. I've also realised that I [[lose concentration]] quickly when my phone is on the desk, so now I leave it in another room.","n":"P–E–E: khó khăn → hệ quả (thức khuya) → giải pháp bản thân. Chia động từ cụm thành dạng -ing sau \"end up\" (end up + V-ing) là điểm ngữ pháp hay.","vocab":[["burning the midnight oil","thức khuya làm việc/học"],["lose concentration","mất tập trung"]]},{"part":1,"q":"Would you like to change your job in the future?","cue":null,"a":"Probably, yes. I enjoy my current role, but I don't think I'm [[cut out for]] the same desk job for the rest of my life. Ideally, I'd like to [[climb the career ladder]] and eventually lead my own team.","n":"Trả lời có rào đón (\"Probably\") + lý do + mong muốn tương lai (I'd like to… eventually). Hai thành ngữ nghề nghiệp đúng ngữ cảnh.","vocab":[["cut out for","phù hợp với (nghề, việc)"],["climb the career ladder","thăng tiến trong sự nghiệp"]]},{"part":2,"q":"Describe a skill that was difficult for you to learn","cue":["what the skill was","when you learned it","how you learned it","and explain why it was difficult"],"a":"I'm going to talk about learning to drive a car, which honestly was one of the most stressful things I've ever done.<br>I learned about two years ago, right after I finished university, because I'd got a job offer that required some travelling.<br>I signed up for a course at a local driving school. For the first month we practised in an empty car park, and after that my instructor took me onto real roads. I also practised with my father on Sunday mornings when the streets were quieter.<br>So why was it so hard? Firstly, it was [[a steep learning curve]]. In Vietnam most people ride motorbikes, so I had to get used to judging the size of a car and checking three mirrors at once. Secondly, the traffic in my city is chaotic, and I used to panic whenever a motorbike cut in front of me. I [[fell behind]] the other learners at first and almost failed my first test.<br>In the end, though, I passed on my second attempt. It taught me that even if you're not [[a quick learner]], steady practice pays off, and now I actually enjoy driving.","n":"Mở bài nêu chủ đề + cảm xúc ngay. Phần \"why\" có Firstly / Secondly và chi tiết rất cụ thể của Việt Nam (xe máy cắt đầu) — chi tiết thật giúp nói trôi chảy hơn. Kết bằng bài học. Lưu ý \"used to panic\" = thói quen trong quá khứ.","vocab":[["a steep learning curve","giai đoạn học rất vất vả lúc đầu"],["fell behind","bị tụt lại phía sau"],["a quick learner","người học nhanh"]]},{"part":3,"q":"Is it better to learn practical skills or academic knowledge at school?","cue":null,"a":"I believe schools need both, but at the moment the balance leans too far towards theory. Students memorise facts for exams, which is basically [[rote learning]], yet many graduates can't manage money or cook a simple meal. In Finland, for instance, students learn practical subjects like cooking and woodwork alongside maths. If Vietnamese schools added more of these lessons, young people would leave school far more independent.","n":"PEER: Point (cần cả hai, nhưng lệch về lý thuyết) → Explanation (học vẹt) → Example (Phần Lan) → Redirection bằng câu điều kiện loại 2 hướng tới giải pháp. Đưa quan điểm cân bằng là cách an toàn ở Part 3.","vocab":[["rote learning","học vẹt"]]},{"part":3,"q":"What makes a job satisfying?","cue":null,"a":"Salary matters, of course, but I'd argue that [[job satisfaction]] comes mainly from feeling useful and growing. If you can see the results of your work and keep learning, you stay motivated. A nurse, for example, may not be highly paid, but helping patients gives her a real sense of purpose. Having said that, if the pay is too low to live on, even a meaningful job becomes stressful.","n":"PEER: Point (\"I'd argue…\") → Explanation (thấy kết quả + học hỏi) → Example (y tá) → Redirection (\"Having said that…\" thừa nhận vai trò tiền lương). Cụm \"a sense of purpose\" nâng Từ vựng.","vocab":[["job satisfaction","sự hài lòng với công việc"]]}]},{"id":"sp-tech-media","en":"Technology and media","vi":"Công nghệ và truyền thông","cues":["Part 1: Mobile apps","Part 1: Headphones","Part 1: Advertisement","Part 2: Describe an occasion when you were not allowed to use your mobile phone","Part 2: Describe a piece of local news that people were interested in","Part 2: Describe a time you saw something interesting on social media","Part 2: Describe an article on health you read in a magazine or on the Internet","Collins Unit 5: Communication (Language and communication)","Collins Unit 6: Technology (Science and technology)"],"words":[["smartphone","điện thoại thông minh","I use my smartphone for almost everything.","basic"],["download an app","tải một ứng dụng","I downloaded an app to learn vocabulary.","basic"],["social media","mạng xã hội","I spend about two hours a day on social media.","basic"],["send messages","nhắn tin","I send messages to my friends on Zalo.","basic"],["read the news","đọc tin tức","I read the news on my phone every morning.","basic"],["watch videos online","xem video trên mạng","I watch videos online to learn cooking.","basic"],["wear headphones","đeo tai nghe","I wear headphones when I study in the library.","basic"],["an advert","quảng cáo","I saw an advert for a new phone on TV.","basic"],["play games","chơi game","My brother plays games on his tablet every night.","basic"],["video call","gọi video","I make a video call to my parents every Sunday.","basic"],["the latest model","mẫu mới nhất","My friend always buys the latest model of iPhone.","basic"],["turn off my phone","tắt điện thoại","I had to turn off my phone during the exam.","basic"],["online shopping","mua sắm trực tuyến","Online shopping saves me a lot of time.","basic"],["addicted to","nghiện","Many teenagers are addicted to their phones.","intermediate"],["user-friendly","dễ sử dụng","This app is very user-friendly.","intermediate"],["go viral","lan truyền chóng mặt","A video of a street vendor went viral last month.","intermediate"],["catchy slogan","khẩu hiệu dễ nhớ","The advert had a catchy slogan that everyone remembered.","intermediate"],["keep up with","theo kịp","It's hard to keep up with new technology.","intermediate"],["screen time","thời gian dùng màn hình","I try to limit my screen time before bed.","intermediate"],["stay connected","giữ kết nối","Social media helps me stay connected with old friends.","intermediate"],["fake news","tin giả","You have to be careful about fake news online.","intermediate"],["noise-cancelling","chống ồn","My noise-cancelling headphones are a lifesaver on the bus.","intermediate"],["a notification","thông báo (trên điện thoại)","I turn off notifications when I need to focus.","intermediate"],["influencer","người có sức ảnh hưởng trên mạng","Many influencers promote products they never use.","intermediate"],["a reliable source","nguồn đáng tin cậy","I only share news from a reliable source.","intermediate"],["face-to-face","trực tiếp, mặt đối mặt","I prefer talking face-to-face rather than texting.","intermediate"],["tech-savvy","rành công nghệ","My younger brother is much more tech-savvy than me.","intermediate"],["glued to the screen","dán mắt vào màn hình","Kids are glued to the screen for hours.","advanced"],["a digital detox","cai nghiện thiết bị số","I did a digital detox for a whole weekend.","advanced"],["a double-edged sword","con dao hai lưỡi","Social media is a double-edged sword.","advanced"],["clickbait","tiêu đề câu view","I hate clickbait headlines that promise too much.","advanced"],["information overload","quá tải thông tin","Information overload makes it hard to focus.","advanced"],["cutting-edge","tiên tiến nhất","The company uses cutting-edge technology.","advanced"],["stay in the loop","luôn cập nhật thông tin","I follow local pages to stay in the loop.","advanced"],["an echo chamber","buồng vang (chỉ nghe quan điểm giống mình)","Social media can become an echo chamber.","advanced"],["a far cry from","khác xa so với","Today's phones are a far cry from the ones we had ten years ago.","advanced"],["tech-free zone","khu vực không thiết bị","Our dining table is a tech-free zone.","advanced"],["hooked on","mê mẩn, nghiện","I got hooked on a puzzle app last month.","advanced"],["word of mouth","truyền miệng","The cafe became popular through word of mouth.","advanced"],["the talk of the town","chủ đề bàn tán khắp nơi","The new bridge was the talk of the town.","advanced"]],"models":[{"part":1,"q":"How often do you use your phone?","cue":null,"a":"Far too often, if I'm honest. I use my [[smartphone]] for almost everything — banking, studying, even ordering food. I've noticed my [[screen time]] is around six hours a day, so I'm trying to cut it down.","n":"Thừa nhận + ví dụ liệt kê (dấu gạch ngang khi nói = ngừng một nhịp) + số liệu cá nhân. Ngắn gọn, đúng độ dài Part 1.","vocab":[["smartphone","điện thoại thông minh"],["screen time","thời gian dùng màn hình"]]},{"part":1,"q":"Do you like watching advertisements?","cue":null,"a":"Not really. Most of them are repetitive, and on YouTube they interrupt what I'm watching. That said, I do enjoy clever ones with a [[catchy slogan]] or a funny story — some ads are almost like short films.","n":"Trả lời \"Not really\" rồi nêu ngoại lệ (\"That said…\") — giúp câu trả lời có hai chiều, tránh nhàm.","vocab":[["catchy slogan","khẩu hiệu dễ nhớ"]]},{"part":1,"q":"Do you read news online or in newspapers?","cue":null,"a":"Almost always online, mainly through news apps. It's faster and I can read on the go. The downside is that there's a lot of [[fake news]], so I try to stick to a couple of [[reliable sources]].","n":"P–E–E: lựa chọn → lợi ích → mặt trái + cách xử lý. \"on the go\" (khi đang di chuyển) là cụm nói tự nhiên.","vocab":[["fake news","tin giả"],["reliable sources","nguồn đáng tin cậy"]]},{"part":2,"q":"Describe a time you saw something interesting on social media","cue":["when it was","what you saw","why it was interesting","and explain how you felt about it"],"a":"I'd like to describe a video I came across on Facebook a few months ago, while I was waiting for a bus.<br>It showed an elderly man in Hanoi who repairs old bicycles for free for students from poor families. He works in a tiny space on the pavement, and the clip followed him for a whole day, from fixing a broken chain to teaching a boy how to pump up his tyres.<br>What made it interesting was how quietly he did it. There was no music, no fancy editing, just him working and chatting with the kids. Within a week the clip had [[gone viral]], with millions of views, and people started donating spare parts to him.<br>I found it really moving. So much of what I see online is [[clickbait]] or people showing off, so this felt like [[a breath of fresh air]]. It reminded me that social media can be [[a double-edged sword]]: it spreads negativity very easily, but it can also spread kindness just as fast.<br>After watching it, I actually shared it with my family group chat, and my mum still mentions it now.","n":"Bài kể chuyện: bối cảnh (when/where) → nội dung → vì sao thú vị → cảm xúc. Dùng quá khứ hoàn thành \"had gone viral\" cho mốc \"within a week\". Thành ngữ \"a double-edged sword\" đặt đúng chỗ — dùng ít mà trúng mới ăn điểm, nhồi nhiều sẽ bị trừ.","vocab":[["gone viral","đã lan truyền chóng mặt"],["clickbait","tiêu đề câu view"],["a breath of fresh air","làn gió mới, điều dễ chịu"],["a double-edged sword","con dao hai lưỡi"]]},{"part":3,"q":"Has technology made people communicate better or worse?","cue":null,"a":"In some ways better, in others worse. We can now [[stay connected]] with relatives on the other side of the world for free, which was impossible twenty years ago. But face-to-face conversation is suffering; you often see a family at a restaurant all looking at their phones. So I think technology itself is neutral — what matters is whether we control it or it controls us.","n":"PEER: Point (hai mặt) → Explanation (lợi ích) → Example (gia đình ở nhà hàng) → Redirection (công nghệ trung tính). Câu kết đối xứng \"we control it or it controls us\" rất ấn tượng với giám khảo.","vocab":[["stay connected","giữ kết nối"]]},{"part":3,"q":"Should children's screen time be limited?","cue":null,"a":"Yes, I think so, especially for young children. Too much time on devices can affect their sleep and attention span, and they miss out on playing outside. My nephew, for instance, became quite irritable when he spent hours on a tablet. However, a total ban isn't realistic, because children also need [[digital skills]]. Clear time limits are probably the most sensible solution.","n":"PEER đủ bước, Redirection dùng \"However…\" để đưa giải pháp trung dung. Cụm \"attention span\", \"miss out on\" là từ vựng band 7.","vocab":[["digital skills","kỹ năng số"]]}]},{"id":"sp-experiences","en":"Experiences, events and feelings","vi":"Trải nghiệm, sự kiện và cảm xúc","cues":["Part 2: Describe a time when you waited for something special that would happen","Part 2: Describe an occasion when many people were smiling","Part 2: Describe a time when you shared something with others","Part 2: Describe a time you tried to do something but was not very successful","Part 2: Describe a difficult decision that you once made","Part 2: Describe a difficult thing you did","Part 2: Describe a time you had to do something and had a positive result","Part 1: Cooperation","Collins Unit 8: Youth"],"words":[["a special day","một ngày đặc biệt","My graduation was a special day for my whole family.","basic"],["feel nervous","cảm thấy hồi hộp","I felt nervous before my first job interview.","basic"],["feel proud","cảm thấy tự hào","I felt proud when I passed the exam.","basic"],["be excited about","háo hức về","I was really excited about the trip.","basic"],["make a decision","đưa ra quyết định","It took me a week to make a decision.","basic"],["work together","làm việc cùng nhau","We worked together to clean the classroom.","basic"],["have fun","vui vẻ","We had fun at the class party.","basic"],["a happy memory","kỷ niệm vui","That trip is a happy memory for me.","basic"],["wait for","chờ đợi","I waited for my exam results for two weeks.","basic"],["try my best","cố gắng hết sức","I tried my best, but I didn't win.","basic"],["share with","chia sẻ với","I shared my snacks with my classmates.","basic"],["when I was a child","khi tôi còn nhỏ","When I was a child, I lived with my grandparents.","basic"],["it was a big surprise","đó là một bất ngờ lớn","It was a big surprise when my friends threw me a party.","basic"],["butterflies in my stomach","bồn chồn, hồi hộp","I had butterflies in my stomach before the speech.","intermediate"],["over the moon","vui sướng tột cùng","I was over the moon when I got the scholarship.","intermediate"],["a turning point","bước ngoặt","Moving to the city was a turning point in my life.","intermediate"],["count down the days","đếm ngược từng ngày","I counted down the days until the concert.","intermediate"],["weigh up the pros and cons","cân nhắc ưu nhược điểm","I weighed up the pros and cons before changing jobs.","intermediate"],["learn from my mistakes","rút kinh nghiệm từ sai lầm","I learned from my mistakes and did better next time.","intermediate"],["it didn't go as planned","mọi việc không như dự định","The picnic didn't go as planned because of the rain.","intermediate"],["a sense of achievement","cảm giác thành tựu","Finishing the marathon gave me a sense of achievement.","intermediate"],["look forward to","mong chờ","I'm looking forward to the summer holiday.","intermediate"],["a memorable experience","trải nghiệm đáng nhớ","Volunteering was a memorable experience.","intermediate"],["step out of my comfort zone","bước ra khỏi vùng an toàn","Joining the debate club made me step out of my comfort zone.","intermediate"],["a carefree childhood","tuổi thơ vô lo","I had a carefree childhood in the countryside.","intermediate"],["in the end","cuối cùng","In the end, everything worked out well.","intermediate"],["a team effort","thành quả chung của cả nhóm","Winning the competition was a team effort.","intermediate"],["on cloud nine","sướng như trên mây","I was on cloud nine when I heard the news.","advanced"],["a blessing in disguise","trong cái rủi có cái may","Failing that test was a blessing in disguise.","advanced"],["a weight off my shoulders","trút được gánh nặng","Finishing my thesis was a weight off my shoulders.","advanced"],["back to square one","quay lại vạch xuất phát","My plan failed, so I was back to square one.","advanced"],["a tough call","quyết định khó khăn","Choosing between the two universities was a tough call.","advanced"],["keep my fingers crossed","cầu mong may mắn","I kept my fingers crossed while waiting for the results.","advanced"],["on the edge of my seat","hồi hộp đến nghẹt thở","I was on the edge of my seat during the final.","advanced"],["grin from ear to ear","cười toe toét","Everyone was grinning from ear to ear at the wedding.","advanced"],["a learning experience","bài học kinh nghiệm","It wasn't a success, but it was a learning experience.","advanced"],["follow my heart","làm theo tiếng gọi con tim","In the end, I followed my heart and studied art.","advanced"],["rise to the challenge","vượt qua thử thách","Our team rose to the challenge and finished on time.","advanced"],["the moment of truth","giây phút quyết định","Then came the moment of truth: the results were announced.","advanced"],["bittersweet","vừa vui vừa buồn","Graduation was a bittersweet moment for me.","advanced"]],"models":[{"part":1,"q":"Do you like surprises?","cue":null,"a":"It depends on the surprise. I love small ones, like a friend turning up with coffee. But I'm not keen on big surprises, such as a party, because I [[feel nervous]] when I'm suddenly the centre of attention.","n":"\"It depends\" + hai ví dụ đối lập (small vs big). Cụm \"not keen on\" lịch sự hơn \"don't like\".","vocab":[["feel nervous","cảm thấy hồi hộp"]]},{"part":1,"q":"When was the last time you felt really proud?","cue":null,"a":"Last month, when I got my first band 6.5 in a mock IELTS test. I'd been studying for months, so I [[felt proud]] and relieved at the same time — it really gave me [[a sense of achievement]].","n":"Nêu mốc thời gian + sự kiện + cảm xúc kép (\"proud and relieved\"). Quá khứ hoàn thành tiếp diễn \"I'd been studying\" cho việc kéo dài trước đó.","vocab":[["felt proud","cảm thấy tự hào"],["a sense of achievement","cảm giác thành tựu"]]},{"part":1,"q":"Do you enjoy working in a team?","cue":null,"a":"Generally yes. I think a team usually comes up with better ideas than one person. In my last project, everyone had a different strength, and the result was really [[a team effort]]. The only problem is when one member doesn't pull their weight.","n":"P–E–E + một ý phản biện ngắn cuối câu, khiến câu Part 1 có chiều sâu. \"pull their weight\" là thành ngữ làm việc nhóm rất tự nhiên.","vocab":[["a team effort","thành quả chung của cả nhóm"]]},{"part":2,"q":"Describe a difficult decision that you once made","cue":["what the decision was","when you made it","how you made it","and explain why it was difficult"],"a":"The decision I want to talk about is whether to study abroad or stay in Vietnam for university. It was [[a tough call]] that I faced in my final year of high school.<br>I had been offered a partial scholarship in Australia, but it only covered half of the tuition fees. At the same time, I had a place at a good university in Ho Chi Minh City, close to my family.<br>To decide, I sat down with my parents and we [[weighed up the pros and cons]]. Studying abroad meant better English and international experience, but it would put real pressure on my family's savings. I also talked to two older friends who had studied overseas, and they were very honest about how lonely it can be.<br>It was difficult because both choices were good, and whichever one I chose, I'd lose something. In the end, I decided to stay, partly for financial reasons and partly because my grandmother was ill at that time.<br>Looking back, I think it was the right choice. I've improved my English here anyway, and staying close to home meant I could spend her last year with her. It was [[a turning point]] that taught me to think about other people, not only myself.","n":"Cấu trúc 4 gợi ý rõ ràng, phần \"how\" có quá trình cụ thể (bàn với bố mẹ, hỏi bạn). Câu \"whichever one I chose, I'd lose something\" giải thích vì sao khó — đúng trọng tâm đề. Kết bằng \"Looking back\" + bài học = Redirection của Part 2.","vocab":[["a tough call","quyết định khó khăn"],["weighed up the pros and cons","cân nhắc ưu nhược điểm"],["a turning point","bước ngoặt"]]},{"part":3,"q":"Why do some people find it hard to make decisions?","cue":null,"a":"I think fear of regret is the biggest reason. When people have too many options, they worry that whatever they pick, something else would have been better. Online shopping is a perfect example: you can spend an hour comparing twenty almost identical products. Personally, I find that setting a time limit helps, because most decisions are less important than they feel at the time.","n":"PEER: Point (sợ hối tiếc) → Explanation (quá nhiều lựa chọn) → Example (mua sắm online) → Redirection bằng kinh nghiệm cá nhân + giải pháp. Câu \"would have been better\" là điều kiện loại 3 dùng tự nhiên.","vocab":[]},{"part":3,"q":"Are childhood experiences important for a person's future?","cue":null,"a":"Very much so. The habits and values we form as children often stay with us for life. Someone who had [[a carefree childhood]] with plenty of outdoor play may grow up more confident and curious. On the other hand, I wouldn't say childhood decides everything; plenty of people overcome a difficult start through education and hard work.","n":"PEER: Point → Explanation → Example → Redirection (\"I wouldn't say… decides everything\") — tránh khẳng định tuyệt đối, đúng tinh thần Part 3.","vocab":[["a carefree childhood","tuổi thơ vô lo"]]}]},{"id":"sp-home","en":"Home, hometown and places","vi":"Nhà ở, quê hương và nơi chốn","cues":["Part 1: Home / accommodation","Part 1: Public gardens and parks","Part 2: Describe a town or city where you would like to live in the future","Part 2: Describe a cafe you like to visit","Part 2: Describe a tall building in your city you like or dislike","Part 2: Describe a quiet place you like to spend your time in","Part 2: Describe a piece of equipment that is important in your home","Collins Unit 9: Home (People and places)"],"words":[["live in a flat","sống trong căn hộ","I live in a flat on the fifth floor with my family.","basic"],["terraced house","nhà ống, nhà liền kề","Like many families in Vietnam, we live in a terraced house.","basic"],["quiet neighbourhood","khu phố yên tĩnh","I live in a quiet neighbourhood near the river.","basic"],["hometown","quê nhà","My hometown is a small coastal city in central Vietnam.","basic"],["living room","phòng khách","My family spends most of our time in the living room.","basic"],["move house","chuyển nhà","We moved house when I was ten.","basic"],["city centre","trung tâm thành phố","My flat is about ten minutes from the city centre.","basic"],["in the countryside","ở nông thôn","My grandparents live in the countryside.","basic"],["noisy street","con phố ồn ào","I can't sleep well because I live on a noisy street.","basic"],["feel at home","cảm thấy như ở nhà","I always feel at home in my grandmother's house.","basic"],["have my own room","có phòng riêng","Now I have my own room, so I can study in peace.","basic"],["well-known for","nổi tiếng vì","My hometown is well-known for its beaches.","basic"],["a lot of green space","nhiều không gian xanh","I wish my city had a lot of green space.","basic"],["spacious","rộng rãi","Our new apartment is bright and spacious.","intermediate"],["cosy","ấm cúng","My bedroom is small but very cosy.","intermediate"],["cramped","chật chội","The dormitory room was cramped, with four people sharing it.","intermediate"],["residential area","khu dân cư","I live in a residential area with lots of schools.","intermediate"],["a stone's throw from","rất gần","My house is a stone's throw from the beach.","intermediate"],["high-rise building","toà nhà cao tầng","High-rise buildings are popping up everywhere in my city.","intermediate"],["peace and quiet","sự yên bình","I go to the park for some peace and quiet.","intermediate"],["lively atmosphere","không khí sôi động","I love the lively atmosphere of the night market.","intermediate"],["get away from it all","thoát khỏi mọi bộn bề","I go to that cafe to get away from it all.","intermediate"],["the cost of living","chi phí sinh hoạt","The cost of living in Ho Chi Minh City is quite high.","intermediate"],["home appliance","đồ gia dụng","The washing machine is the most useful home appliance in my house.","intermediate"],["decorate my room","trang trí phòng","I decorated my room with posters and fairy lights.","intermediate"],["a sense of community","tinh thần cộng đồng","There is a strong sense of community in my village.","intermediate"],["tourist attraction","điểm thu hút khách du lịch","The old town is the main tourist attraction in my hometown.","intermediate"],["a home bird","người thích ở nhà","I'm a bit of a home bird, so I rarely go out at night.","advanced"],["hustle and bustle","sự hối hả, nhộn nhịp","I enjoy the hustle and bustle of city life.","advanced"],["off the beaten track","hẻo lánh, ít người biết","My favourite cafe is off the beaten track, so it's never crowded.","advanced"],["an eyesore","thứ chướng mắt","That grey office tower is an eyesore in the middle of the old town.","advanced"],["picturesque","đẹp như tranh","My hometown is a picturesque fishing village.","advanced"],["urban sprawl","đô thị lan rộng thiếu quy hoạch","Urban sprawl has swallowed the rice fields around my city.","advanced"],["state-of-the-art","hiện đại bậc nhất","The new library is a state-of-the-art building.","advanced"],["make yourself at home","cứ tự nhiên như ở nhà","My friend's mother always tells me to make myself at home.","advanced"],["a hidden gem","viên ngọc ẩn, nơi hay ít người biết","This little bookshop cafe is a hidden gem.","advanced"],["a concrete jungle","rừng bê tông","The city centre has become a concrete jungle.","advanced"],["put down roots","định cư lâu dài","I'd like to put down roots in Da Nang one day.","advanced"],["a breath of fresh air","làn gió mới, điều dễ chịu","Moving to the suburbs was a breath of fresh air for my family.","advanced"]],"models":[{"part":1,"q":"What kind of home do you live in?","cue":null,"a":"I live in a [[terraced house]] in a fairly [[quiet neighbourhood]], with my parents and younger brother. It's quite narrow but tall, with four floors, and my favourite part is the small rooftop where my mum grows herbs.","n":"Kiểu nhà + người sống cùng + chi tiết riêng (sân thượng trồng rau). Mô tả nhà ống bằng \"narrow but tall\" rất đúng ngữ cảnh Việt Nam.","vocab":[["terraced house","nhà ống, nhà liền kề"],["quiet neighbourhood","khu phố yên tĩnh"]]},{"part":1,"q":"What do you like most about your hometown?","cue":null,"a":"Definitely the food and the pace of life. My hometown is a small coastal city, so it's much more relaxed than Ho Chi Minh City. Whenever I go back, I really [[feel at home]] — people say hello to you in the street.","n":"P–E–E: điều thích → so sánh với thành phố lớn → chi tiết cảm xúc. \"the pace of life\" là cụm hay cho chủ đề nơi chốn.","vocab":[["feel at home","cảm thấy như ở nhà"]]},{"part":1,"q":"Would you prefer to live in the city centre or the suburbs?","cue":null,"a":"At this stage of my life, the city centre. I love the [[hustle and bustle]] and having everything a [[stone's throw]] away. But when I have children, I'd probably move to the suburbs for more space and fresh air.","n":"Trả lời theo giai đoạn cuộc đời (\"At this stage… But when I have children…\") — chiến thuật hay để nói hai phía mà không mâu thuẫn.","vocab":[["hustle and bustle","sự hối hả, nhộn nhịp"],["stone's throw","rất gần"]]},{"part":2,"q":"Describe a quiet place you like to spend your time in","cue":["where it is","how often you go there","what you do there","and explain why you like it"],"a":"The place I'd like to describe is a small cafe on the top floor of an old apartment building in District 1. It's a real [[hidden gem]], because from the street you would never guess it's there.<br>I go there about once a week, usually on Saturday mornings before it gets busy.<br>To get in, you climb three flights of stairs past tailors' shops and tiny offices, and then you suddenly come into a bright room full of plants and old books. I normally order an iced coffee, sit by the window, and either read or plan my week. Sometimes I just watch the traffic below, which looks oddly peaceful from up there.<br>I like it for a few reasons. First, it gives me some [[peace and quiet]] in the middle of a very noisy city. The owner plays soft jazz and people tend to speak in low voices. Second, it's [[off the beaten track]], so it's never crowded with tourists. And finally, it's simply a place where I can [[get away from it all]] without leaving the city.<br>Whenever I've had a stressful week, an hour there is enough to make me feel like myself again.","n":"Mô tả đường đi lên quán (climb three flights of stairs…) tạo hình ảnh — giám khảo đánh giá cao khả năng miêu tả. Ba lý do có tín hiệu First / Second / And finally. Câu kết cảm xúc gọn.","vocab":[["hidden gem","viên ngọc ẩn, nơi hay ít người biết"],["peace and quiet","sự yên bình"],["off the beaten track","hẻo lánh, ít người biết"],["get away from it all","thoát khỏi mọi bộn bề"]]},{"part":3,"q":"What are the disadvantages of living in a big city?","cue":null,"a":"The most obvious one is the [[cost of living]], especially housing. Rents in central areas have risen so fast that many young workers have to share small rooms. Pollution and traffic are also serious; in Ho Chi Minh City, a ten-kilometre commute can take an hour at rush hour. Having said that, cities still offer the best job opportunities, which is why people keep moving there despite these problems.","n":"PEER: Point (chi phí) → Explanation (giá thuê) → Example (quãng đường 10 km mất 1 giờ) → Redirection (vì sao người ta vẫn đến). Ví dụ có số liệu cụ thể làm câu trả lời thuyết phục.","vocab":[["cost of living","chi phí sinh hoạt"]]},{"part":3,"q":"How has housing changed in your country in recent years?","cue":null,"a":"The biggest change is that we're building upwards. Twenty years ago most city families lived in terraced houses, but now [[high-rise buildings]] are everywhere, because land is so expensive. Apartments are more modern and secure, but some older people miss the [[sense of community]] of the old neighbourhoods, where everyone knew each other.","n":"So sánh quá khứ–hiện tại (Twenty years ago… but now…) là khung chuẩn cho câu hỏi \"how has … changed\". Redirection nêu mặt mất đi.","vocab":[["high-rise buildings","toà nhà cao tầng"],["sense of community","tinh thần cộng đồng"]]}]},{"id":"sp-travel","en":"Travel and transport","vi":"Du lịch và đi lại","cues":["Part 1: Car trip","Part 1: Getting lost","Part 1: Holidays","Part 1: Weather","Part 2: Describe a place you visited on vacation","Part 2: Describe a bicycle/motorcycle/car trip you would like to go on","Part 2: Describe a time when you got up early","Collins Unit 11: On the move (Holidays and travel)"],"words":[["go on holiday","đi nghỉ","We go on holiday to Da Lat every summer.","basic"],["travel abroad","đi du lịch nước ngoài","I travelled abroad for the first time last year.","basic"],["by motorbike","bằng xe máy","Most people in my city get around by motorbike.","basic"],["get lost","bị lạc","I got lost in Bangkok because I couldn't read the signs.","basic"],["traffic jam","kẹt xe","I was stuck in a traffic jam for an hour.","basic"],["book a hotel","đặt khách sạn","I always book a hotel online before I travel.","basic"],["go sightseeing","đi tham quan","We went sightseeing in the old quarter.","basic"],["a road trip","chuyến đi đường dài bằng xe","We went on a road trip along the coast.","basic"],["local food","đồ ăn địa phương","Trying local food is the best part of travelling.","basic"],["sunny weather","thời tiết nắng đẹp","I prefer sunny weather for travelling.","basic"],["rainy season","mùa mưa","The rainy season in my city lasts from September to December.","basic"],["public transport","phương tiện công cộng","Public transport in my hometown isn't very convenient.","basic"],["a map app","ứng dụng bản đồ","I use a map app so I don't get lost.","basic"],["breathtaking view","khung cảnh ngoạn mục","The view from the top of the mountain was breathtaking.","intermediate"],["travel on a budget","du lịch tiết kiệm","As a student, I usually travel on a budget.","intermediate"],["a once-in-a-lifetime experience","trải nghiệm có một không hai","Seeing Ha Long Bay was a once-in-a-lifetime experience.","intermediate"],["get away for the weekend","đi xa nghỉ cuối tuần","We like to get away for the weekend when we're stressed.","intermediate"],["rush hour","giờ cao điểm","I avoid driving during rush hour.","intermediate"],["set off","khởi hành","We set off at five in the morning to avoid the heat.","intermediate"],["jet lag","mệt do lệch múi giờ","I had terrible jet lag after flying to Canada.","intermediate"],["a tourist trap","nơi chặt chém khách du lịch","That beach has become a tourist trap.","intermediate"],["ask for directions","hỏi đường","I had to ask for directions three times.","intermediate"],["pack my bags","xếp đồ, chuẩn bị đi","I packed my bags the night before the trip.","intermediate"],["scenic route","cung đường đẹp","We took the scenic route through the mountains.","intermediate"],["an early riser","người dậy sớm","I'm not an early riser, but I got up at 4 a.m. for the sunrise.","intermediate"],["humid","nồm, ẩm ướt","Summer in Hanoi is hot and humid.","intermediate"],["weather forecast","dự báo thời tiết","I always check the weather forecast before a trip.","intermediate"],["have itchy feet","ham đi, không chịu ở yên","After a few months at home, I get itchy feet.","advanced"],["travel light","đi du lịch gọn nhẹ","I prefer to travel light with just a backpack.","advanced"],["soak up the atmosphere","tận hưởng bầu không khí","We sat in the square to soak up the atmosphere.","advanced"],["a change of scenery","thay đổi không khí","I needed a change of scenery after my exams.","advanced"],["go off the grid","tách khỏi mạng, sống biệt lập","I'd love to go off the grid for a week in the mountains.","advanced"],["wanderlust","niềm khao khát đi xa","My wanderlust started when I read travel blogs.","advanced"],["at the crack of dawn","lúc tờ mờ sáng","We got up at the crack of dawn to catch the boat.","advanced"],["bumper-to-bumper traffic","xe cộ nối đuôi nhau","There was bumper-to-bumper traffic on the way to the airport.","advanced"],["a scorching day","ngày nóng như thiêu","It was a scorching day, so we stayed in the shade.","advanced"],["under the weather","hơi mệt, không khoẻ","I felt a bit under the weather after the long flight.","advanced"],["lose my bearings","mất phương hướng","I lost my bearings in the maze of small alleys.","advanced"],["broaden my horizons","mở mang tầm mắt","Travelling alone really broadened my horizons.","advanced"]],"models":[{"part":1,"q":"Do you like travelling?","cue":null,"a":"Very much. I [[have itchy feet]] if I stay in one place for too long. I usually [[travel on a budget]], taking night buses and staying in hostels, but that's part of the fun.","n":"P–E–E ngắn. Thành ngữ \"itchy feet\" dùng đúng người đúng việc.","vocab":[["have itchy feet","ham đi, không chịu ở yên"],["travel on a budget","du lịch tiết kiệm"]]},{"part":1,"q":"Have you ever got lost?","cue":null,"a":"Yes, in Bangkok a couple of years ago. My phone battery died, so I couldn't use the [[map app]], and I [[lost my bearings]] in a maze of small streets. In the end a street vendor drew me a map on a napkin.","n":"Kể chuyện 3 câu: bối cảnh → sự cố → kết thúc có chi tiết đáng nhớ (vẽ bản đồ lên khăn giấy).","vocab":[["map app","ứng dụng bản đồ"],["lost my bearings","mất phương hướng"]]},{"part":1,"q":"What's the weather like in your hometown?","cue":null,"a":"It's tropical, so it's hot all year round. From May to October we have the [[rainy season]], with heavy showers almost every afternoon, and the rest of the year is [[humid]] and sunny.","n":"Câu Part 1 dạng mô tả: ý chính → chi tiết theo mùa. Không cần ý kiến, chỉ cần từ vựng chính xác.","vocab":[["rainy season","mùa mưa"],["humid","nồm, ẩm ướt"]]},{"part":2,"q":"Describe a place you visited on vacation","cue":["where it was","when you went there","what you did there","and explain how you felt about it"],"a":"I'd like to talk about Ha Giang, a mountainous province in the far north of Vietnam, which I visited last October with three university friends.<br>We rented motorbikes in Ha Giang city and spent four days riding the famous loop through the mountains. We [[set off]] every morning at around six to avoid the afternoon fog.<br>Most of the time we were just riding and stopping to take photos, because every bend in the road revealed a [[breathtaking view]] — huge valleys, rice terraces turning gold, and tiny villages on the hillsides. In the evenings we stayed in homestays run by local families, drank corn wine, ate sticky rice, and chatted with other travellers around the fire.<br>How did I feel? Honestly, exhausted at times, because the roads are steep and my back ached. But overall I felt incredibly free. It was a real [[change of scenery]] after months of studying, and being so far from the city made me appreciate simple things like a hot meal and clean air.<br>I'd say it was [[a once-in-a-lifetime experience]], and it definitely [[broadened my horizons]]; I'd love to go back in spring when the flowers are out.","n":"Có địa danh, thời gian, người đi cùng ngay câu đầu — giải quyết 2 gợi ý trong 1 câu, tiết kiệm thời gian. Phần cảm xúc nói thật cả mặt mệt mỏi (\"exhausted at times\") rồi chuyển sang tích cực — nghe tự nhiên, không học thuộc.","vocab":[["set off","khởi hành"],["breathtaking view","khung cảnh ngoạn mục"],["change of scenery","thay đổi không khí"],["a once-in-a-lifetime experience","trải nghiệm có một không hai"],["broadened my horizons","mở mang tầm mắt"]]},{"part":3,"q":"What are the benefits of travelling for young people?","cue":null,"a":"I think travel teaches independence better than any classroom. When young people travel, they have to solve problems on their own, like finding transport or dealing with a cancelled booking. For example, my first solo trip forced me to talk to strangers, which made me much more confident. Of course, it can be expensive, but even short trips within your own country bring many of the same benefits.","n":"PEER: Point → Explanation (tự giải quyết vấn đề) → Example (chuyến đi một mình) → Redirection (\"Of course… but even…\" — nhượng bộ chi phí rồi đưa giải pháp).","vocab":[]},{"part":3,"q":"How does tourism affect local communities?","cue":null,"a":"It cuts both ways. On the positive side, tourism creates jobs, from hotels to small food stalls, and gives locals a reason to preserve their traditions. However, too many visitors can turn a place into a [[tourist trap]]; prices go up and local people may be pushed out of their own neighbourhoods. Hoi An is a good example, where the old town is beautiful but now very crowded. So I think tourism needs careful management rather than unlimited growth.","n":"Câu trả lời hai mặt có khung rõ: On the positive side → However → ví dụ Hội An → kết luận \"rather than\". Đây là mẫu dùng được cho mọi câu \"How does X affect Y\".","vocab":[["tourist trap","nơi chặt chém khách du lịch"]]}]},{"id":"sp-nature","en":"Nature, environment and animals","vi":"Thiên nhiên, môi trường và động vật","cues":["Part 1: Wild animals","Part 1: Flowers","Part 1: Pets and animals","Part 1: Sky","Part 1: Environmental protection","Part 2: Describe a law on environmental protection your country should have","Collins Unit 4: The world around us (Nature and the environment)"],"words":[["keep a pet","nuôi thú cưng","I'd love to keep a pet, but my flat is too small.","basic"],["look after","chăm sóc","I look after my neighbour's dog when she's away.","basic"],["wild animals","động vật hoang dã","I've only seen wild animals at the zoo.","basic"],["plant trees","trồng cây","Our school plants trees every spring.","basic"],["throw rubbish","vứt rác","Some people still throw rubbish on the beach.","basic"],["fresh air","không khí trong lành","I go to the park for some fresh air.","basic"],["recycle","tái chế","My family recycles plastic bottles.","basic"],["grow flowers","trồng hoa","My mother grows flowers on our balcony.","basic"],["starry sky","bầu trời đầy sao","In the countryside, you can see a starry sky at night.","basic"],["plastic bags","túi ni lông","Supermarkets should stop giving out plastic bags.","basic"],["save water","tiết kiệm nước","I turn off the tap to save water.","basic"],["go to the zoo","đi sở thú","We went to the zoo on my birthday.","basic"],["sunset","hoàng hôn","I love watching the sunset from the beach.","basic"],["air pollution","ô nhiễm không khí","Air pollution in big cities is getting worse.","intermediate"],["endangered species","loài có nguy cơ tuyệt chủng","Tigers are an endangered species.","intermediate"],["single-use plastic","nhựa dùng một lần","We should ban single-use plastic.","intermediate"],["in full bloom","đang nở rộ","The cherry trees were in full bloom.","intermediate"],["eco-friendly","thân thiện với môi trường","I try to buy eco-friendly products.","intermediate"],["be close to nature","gần gũi thiên nhiên","I feel happier when I'm close to nature.","intermediate"],["a stray dog","chó hoang","We adopted a stray dog last year.","intermediate"],["natural habitat","môi trường sống tự nhiên","Animals should live in their natural habitat.","intermediate"],["impose a fine","phạt tiền","The government should impose a fine on people who litter.","intermediate"],["littering","xả rác bừa bãi","Littering is a big problem in my city.","intermediate"],["climate change","biến đổi khí hậu","Climate change is affecting farmers in my region.","intermediate"],["reduce waste","giảm rác thải","Bringing your own bottle helps reduce waste.","intermediate"],["breathtaking scenery","phong cảnh ngoạn mục","The national park has breathtaking scenery.","intermediate"],["loyal companion","người bạn trung thành","My dog is a loyal companion.","intermediate"],["a nature lover","người yêu thiên nhiên","I'm a nature lover, so I go hiking whenever I can.","advanced"],["on the verge of extinction","đứng bên bờ tuyệt chủng","Some turtles are on the verge of extinction.","advanced"],["carbon footprint","lượng khí thải carbon cá nhân","Cycling to work reduces my carbon footprint.","advanced"],["strictly enforced","được thực thi nghiêm","Environmental laws should be strictly enforced.","advanced"],["a heavy-handed approach","cách làm quá cứng rắn","A total ban might be a heavy-handed approach.","advanced"],["biodiversity","đa dạng sinh học","Deforestation is destroying biodiversity.","advanced"],["raise awareness","nâng cao nh
